<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Маршрут">
<meta name="theme-color" content="#1a7a40">
<link rel="manifest" href="/delivery-app/manifest-driver.json">
<link rel="apple-touch-icon" href="/delivery-app/icons/icon-driver-192.png">
<title>Маршрут</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f8f4;color:#141a16;font-family:'Segoe UI',sans-serif;font-size:15px;padding-bottom:100px}
.hdr{background:#6a1a7a;padding:16px 20px;position:sticky;top:0;z-index:10}
.hdr h1{color:#fff;font-size:18px;font-weight:700;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer}
.nav button:active{background:rgba(255,255,255,.35)}
.lbl{flex:1;text-align:center;color:#fff;font-size:14px;font-weight:600;background:rgba(255,255,255,.15);border-radius:10px;padding:8px}
.prg{display:flex;align-items:center;gap:8px;margin-top:10px}
.pb{flex:1;height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.pf{height:100%;background:#fff;border-radius:3px;transition:width .3s}
.pt{color:rgba(255,255,255,.9);font-size:12px;min-width:36px;text-align:right}
.sync{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);display:inline-block;margin-left:8px;vertical-align:middle}
.sync.ok{background:#fff}
/* TRIP BUTTONS */
.trip-bar{display:flex;gap:8px;margin-top:10px}
.trip-btn{flex:1;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.trip-btn:active{background:rgba(255,255,255,.35);transform:scale(.97)}
.trip-btn.active{background:rgba(255,255,255,.9);color:#6a1a7a}
.trip-btn.done-all{background:rgba(255,255,255,.9);color:#6a1a7a}
.trip-status{margin-top:8px;font-size:12px;color:rgba(255,255,255,.85);text-align:center;min-height:18px}
.wrap{padding:12px}
.city{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6a1a7a;margin:12px 0 6px 4px}
.card{background:#fff;border-radius:14px;border:2px solid #d8ede2;margin-bottom:10px;overflow:hidden}
.card.dn{opacity:.7}
.cb{display:flex;align-items:flex-start;gap:10px;padding:13px 14px}
.num{width:26px;height:26px;border-radius:50%;background:#6a1a7a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.num.dn{background:rgba(0,0,0,.15)}
.info{flex:1;min-width:0}
.adr{font-size:15px;font-weight:600;color:#141a16;text-decoration:none;display:block;margin-bottom:3px}
.ttag{display:inline-flex;align-items:center;gap:3px;background:#fff3da;color:#7a4a00;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-bottom:4px}
.invs{font-size:12px;color:#5a7060;margin-top:3px}
.inv{display:inline-block;background:#eef3fb;color:#1856a0;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;margin:1px}
.stag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-top:4px}
.str{background:#fff3da;color:#7a4a00}
.ssv{background:#e6f5ec;color:#6a1a7a}
.sur{background:#fff0f2;color:#b00020}
.cmt{font-size:12px;color:#5a7060;margin-top:3px;font-style:italic}
.dbtn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2px solid #d8ede2;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc;margin-top:1px;transition:.15s}
.dbtn.dn{background:#6a1a7a;border-color:#6a1a7a;color:#fff}
.dbtn:active{transform:scale(.92)}
.dbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.mln{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:2px solid #d8ede2;background:rgba(0,0,0,.02);color:#6a1a7a;font-size:13px;font-weight:500;text-decoration:none}
.photo-section{padding:10px 14px;border-top:2px solid #d8ede2;background:#fafaf8}
.photo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid #d8ede2;transition:.15s}
.photo-thumb:active{transform:scale(.95)}
.odo-lock .dbtn,.odo-lock .photo-add,.odo-lock .photo-gal{opacity:.32;filter:grayscale(1)}
.photo-gal{width:56px;height:56px;border-radius:8px;border:2px dashed #c8d4e8;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:#8ba3c7;flex-shrink:0}
.photo-add{width:56px;height:56px;border-radius:8px;border:2px dashed #d8ede2;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#aaa;flex-shrink:0}
.photo-hint{font-size:11px;color:#e07000;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.photo-count{font-size:11px;color:#5a7060;margin-top:4px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lb img{max-width:96vw;max-height:80vh;border-radius:8px;object-fit:contain}
.lb-close{color:#fff;font-size:28px;cursor:pointer;padding:8px 16px;background:rgba(255,255,255,.15);border-radius:20px;border:none}
.empty{text-align:center;padding:60px 20px;color:#5a7060}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2a1e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:998;opacity:0;transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* FAB Add Task */
.fab-add{position:fixed;right:18px;bottom:24px;width:60px;height:60px;border-radius:50%;background:#6a1a7a;color:#fff;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:50;transition:.15s}
.fab-add:active{transform:scale(.92)}
/* Modal sheet for add task */
.add-sheet{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.add-sheet.on{display:flex}
.add-sheet-inner{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 0 28px;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.add-sheet-handle{width:38px;height:4px;background:#d8b0e0;border-radius:2px;margin:6px auto 8px}
.add-sheet-title{text-align:center;font-size:15px;font-weight:600;color:#141a16;padding:10px 16px 14px;border-bottom:1px solid #f0f0f0}
.add-type-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border:none;background:#fff;cursor:pointer;border-bottom:1px solid #f0f0f0;text-align:left}
.add-type-btn:active{background:#f5f5f5}
.add-type-btn:last-of-type{border-bottom:none}
.add-type-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.add-type-icon.delivery{background:#e6eef9;color:#1856a0}
.add-type-icon.trash{background:#fff3da;color:#854F0B}
.add-type-text{flex:1}
.add-type-text-main{font-size:15px;font-weight:600;color:#141a16;margin-bottom:2px}
.add-type-text-sub{font-size:12px;color:#80786e}
.add-cancel{display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:13px;border:none;background:#f5f5f5;color:#80786e;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}

/* Add task form (full screen) */
.add-form{position:fixed;inset:0;z-index:210;background:#f0f8f4;display:none;flex-direction:column;overflow-y:auto;padding-bottom:30px}
.add-form.on{display:flex}
.add-form-hdr{background:#6a1a7a;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.add-form-back{border:none;background:rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer;flex-shrink:0}
.add-form-title{color:#fff;font-size:15px;font-weight:600;flex:1}
.add-form-body{padding:16px;flex:1}
.add-form-hint{font-size:13px;color:#5a7060;margin-bottom:14px;line-height:1.5}
.add-photo-zone{border:2px dashed #d8b0e0;border-radius:12px;padding:30px 20px;text-align:center;background:#fff;cursor:pointer;margin-bottom:14px}
.add-photo-zone:active{background:#f5f5f5}
.add-photo-zone-icon{font-size:40px;color:#6a1a7a;margin-bottom:8px}
.add-photo-zone-text{font-size:14px;font-weight:600;color:#141a16}
.add-photo-zone-sub{font-size:11px;color:#80786e;margin-top:4px}
.add-photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:14px}
.add-photo-preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid #d8b0e0}
.add-photo-preview-item img{width:100%;height:100%;object-fit:cover}
.add-photo-preview-item .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.add-form-label{font-size:12px;color:#5a7060;font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.add-form-input{width:100%;border:1px solid #d8b0e0;border-radius:10px;padding:11px 12px;font-size:14px;background:#fff;color:#141a16;margin-bottom:14px;font-family:inherit}
.add-form-input:focus{outline:2px solid #6a1a7a;outline-offset:-1px}
.add-form-send{width:100%;background:#6a1a7a;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.add-form-send:active{transform:scale(.98)}
.add-form-send:disabled{background:#aac4b3;cursor:not-allowed}

/* Driver-added card visual marker */
.card.driver-added{border-color:#1856a0;border-width:2px;background:linear-gradient(to right,#e6eef9 0,#e6eef9 4px,#fff 4px)}
.card.driver-added .num{background:#1856a0}
.card.driver-added .by-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#1856a0;background:#e6eef9;padding:2px 7px;border-radius:6px;margin-top:4px}



.pin-wrap{position:fixed;inset:0;background:#6a1a7a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;transition:.15s}
.pdot.on{background:#fff;border-color:#fff}
.ppb{height:72px;border-radius:14px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:24px;font-weight:500;cursor:pointer}
.ppb:active{background:rgba(255,255,255,.3)}
/* WORKTIME (рабочее время) */
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-top h1{margin-bottom:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-btn{border:none;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:#fff;white-space:nowrap;flex-shrink:0;line-height:1;background:rgba(255,255,255,.16);transition:background .2s}
.wt-btn:active{transform:scale(.96)}
.wt-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
.wt-btn.idle{background:#e8902e}
.wt-btn.idle .wt-dot{animation:wtBlink 1.6s ease-in-out infinite}
.wt-btn.run{background:#15a34a}
.wt-btn.run .wt-dot{animation:wtBeat 1.4s ease-in-out infinite}
.wt-btn.done{background:rgba(255,255,255,.2)}
@keyframes wtBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes wtBeat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.6}}
.wt-btn.pause{background:#e8902e}
.wt-btn.pause .wt-dot{animation:wtBlink 1.6s ease-in-out infinite}
.wt-two{display:flex;gap:10px}
.wt-two .wt-main{width:auto;flex:1;font-size:15px;padding:14px 8px}
.wt-main.pause{background:#e8902e}
.wt-seglist{font-size:13px;color:#5a7060;margin:-6px 0 14px;line-height:1.7}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav .today-b{width:auto;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:11px;font-weight:700;padding:0 10px;border-radius:9px;flex-shrink:0;cursor:pointer;height:36px}
.wt-line{display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:700;margin-top:10px;min-height:18px}
.wt-line .sd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.wt-line .sd.go{background:#7df0a6}.wt-line .sd.br{background:#ffce7a}.wt-line .sd.off{background:rgba(255,255,255,.55)}
.wt-line .tm{font-variant-numeric:tabular-nums}
.wt-3{display:flex;gap:6px;margin-top:8px}
.wt3{flex:1 1 0;min-width:0;border:none;border-radius:12px;font-size:13.5px;font-weight:800;padding:13px 4px;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.15;cursor:pointer;white-space:nowrap;overflow:hidden}
.wt3:active{transform:scale(.97)}
.wt3.go{background:#15a34a}.wt3.pause{background:#d67e12}.wt3.end{background:#c0392b}.wt3.wheel{background:#1856a0}
.wt3.dim{background:rgba(255,255,255,.12);color:rgba(255,255,255,.42);cursor:default}
.exit-btn{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.exit-btn:active{background:rgba(255,255,255,.3)}
.wt-panel{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.wt-panel.on{display:flex}
.wt-panel-inner{background:#fff;width:100%;max-width:340px;border-radius:18px;padding:22px 20px;text-align:center;animation:wtPop .2s ease}
@keyframes wtPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.wt-panel-title{font-size:13px;font-weight:600;color:#80786e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.wt-status{font-size:17px;color:#141a16;line-height:1.5;margin-bottom:18px}
.wt-status b{font-size:22px;color:#1a7a40}
.wt-main{width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
.wt-main.start{background:#16a34a}
.wt-main.end{background:#d9342b}
.wt-main:active{transform:scale(.98)}
.wt-q{font-size:18px;font-weight:700;color:#141a16;margin-bottom:6px}
.wt-qs{font-size:16px;color:#5a7060;line-height:1.5;margin-bottom:18px}
.wt-qs b{font-size:22px;color:#1a7a40}
.wt-qbtns{display:flex;gap:10px}
.wt-cancel,.wt-yes{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.wt-cancel{background:#f0f0f0;color:#80786e}
.wt-yes{background:#1a7a40;color:#fff}
.wt-cancel:active,.wt-yes:active{transform:scale(.97)}
.wt-done-note{font-size:12px;color:#80786e;margin-top:6px}
.wt-close{margin-top:14px;background:none;border:none;color:#80786e;font-size:14px;cursor:pointer;padding:6px}
/* итог за месяц при закрытии смены */
.wt-summary{position:fixed;inset:0;z-index:400;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.wts-card{background:#fff;width:100%;max-width:280px;border-radius:20px;padding:24px 22px 20px;text-align:center;animation:wtPop .2s ease;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.wts-seal{width:54px;height:54px;border-radius:50%;background:#e6f4ec;color:#1a7a40;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.wts-h{font-size:17px;font-weight:800;color:#20242a;margin-bottom:16px}
.wts-day{font-size:12px;color:#8a8272;text-transform:uppercase;letter-spacing:.04em}
.wts-dayv{font-size:30px;font-weight:800;color:#6a1a7a;line-height:1;margin:3px 0 16px}
.wts-mrow{background:#faf5ec;border:1.5px solid #ecdcc2;border-radius:14px;padding:13px}
.wts-mlbl{font-size:11px;color:#854F0B;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.wts-mval{font-size:26px;font-weight:800;color:#854F0B;line-height:1.1}
.wts-msub{font-size:12px;color:#8a8272;margin-top:2px}
.wts-done{margin-top:16px;width:100%;background:#6a1a7a;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.wts-done:active{transform:scale(.98)}

/* ===== Шапка — Вариант 1 «Спокойный воздух» (дизайн-пас). Переопределяет ранние правила по каскаду. Фон .hdr остаётся per-driver. ===== */
.hdr{padding:16px 18px 18px;position:sticky;top:0;z-index:10}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr h1{margin:0;min-width:0;color:#fff;font-size:18px;font-weight:700;line-height:1.2;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);display:inline-block;margin-left:8px;vertical-align:middle}
.sync.ok{background:#fff}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-actions .val-badge{height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:#2a2431;border:none;border-radius:999px;font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.hdr-actions .val-badge:active{background:#fff}
.exit-btn{height:36px;padding:0 14px;display:inline-flex;align-items:center;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0}
.exit-btn:active{background:rgba(255,255,255,.26)}
.nav{display:flex;align-items:center;gap:8px;margin-top:14px}
.nav button{width:36px;height:36px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;font-size:22px;line-height:1;cursor:pointer}
.nav button:active{background:rgba(255,255,255,.26)}
.lbl{flex:1;min-width:0;text-align:center;color:#fff;font-size:15px;font-weight:600;letter-spacing:.2px;background:transparent;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .today-b{width:auto;height:36px;padding:0 14px;flex-shrink:0;display:inline-flex;align-items:center;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.nav .today-b:active{background:rgba(255,255,255,.26)}
.wt-line{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:20px;color:#fff;font-size:14px;font-weight:600}
.wt-line .sd{width:10px;height:10px;border-radius:50%;flex-shrink:0;animation:none}
.wt-line .sd.go{background:#7df0a6}
.wt-line .sd.br{background:#ffce7a}
.wt-line .sd.off{background:rgba(255,255,255,.55)}
.wt-line .tm{font-variant-numeric:tabular-nums;font-weight:700}
#wt3{margin-top:10px}
.wt-3{display:flex;gap:6px;margin-top:0}
.wt3{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 4px;border:none;border-radius:14px;color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;cursor:pointer}
.wt3:active{transform:scale(.98)}
.wt3.go{background:#15a34a}
.wt3.pause{background:#d67e12}
.wt3.end{background:#c0392b}

<script>
var DRV = (new URLSearchParams(location.search).get('drv') || '').trim();
var TODAY_KEY = '';
firebase.initializeApp({

var db = firebase.database();
var storage = firebase.storage();
// При плохой сети не ждать ~2 мин (дефолт Firebase) — быстрее признать сбой и уйти в очередь на автоповтор
try { storage.setMaxUploadRetryTime(30000); storage.setMaxOperationRetryTime(20000); } catch(e){}
var rows = [], cfg = {drivers:{}}, curD = '', tripData = {};
var activeUploadRowId = null;

function isoD(n) {
  var d = new Date(); d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function nowTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmt(iso) {
  var d = new Date(iso + 'T12:00:00');
  var dn = ['вс','пн','вт','ср','чт','пт','сб'];
  var mn = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return dn[d.getDay()] + ', ' + d.getDate() + ' ' + mn[d.getMonth()] + ' ' + d.getFullYear();
}
function sh(n) {
  var d = new Date(curD + 'T12:00:00'); d.setDate(d.getDate() + n);
  curD = d.toISOString().slice(0, 10); updateTripUI(); render();
}
function xe(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function cleanAddr(a) {
  var s = (a||'').trim();
  s = s.replace(/\s+\d*[A-Za-z]*_[A-Za-z]+$/, '');
  s = s.replace(/\s+(EG|DG|OG|\d+OG)$/i, '');

}
function stTag(s) {

  if (s==='самовывоз')    return '<span class="stag ssv">&#128666; самовывоз</span>';

  if (s==='забрать товар') return '<span class="stag str">&#128722; забрать товар</span>';
  if (s==='перенесено')   return '<span class="stag sur">&#8594; перенесено</span>';
  return '';
}
function driverName() {
  if (cfg.drivers && cfg.drivers[DRV] && cfg.drivers[DRV].name) return cfg.drivers[DRV].name;
  return DRV==='L'?'Лёша':DRV==='R'?'Рома':'Водитель 3';
}
function needsPhoto(r) {
  // Photo required for all statuses (deliveries, trash pickup, store pickup)
  return true;
}

// TRIP
function tripKey() { return curD + '_' + DRV; }
function tripStart() {
  var t = nowTime();
  var data = tripData[tripKey()] || {};
  if (data.start) { showToast('Маршрут уже начат в ' + data.start); return; }
  data.start = t;
  db.ref('trips/' + tripKey()).set(data);
  if (navigator.vibrate) navigator.vibrate(100);
  showToast('Маршрут начат в ' + t);
  updateTripUI();
}
function tripEnd() {
  var t = nowTime();
  var data = tripData[tripKey()] || {};
  if (!data.start) { showToast('Сначала нажмите «Маршрут начат»'); return; }
  if (data.end) { showToast('Уже отмечено в ' + data.end); return; }
  data.end = t;
  db.ref('trips/' + tripKey()).set(data);
  if (navigator.vibrate) navigator.vibrate([100,50,100]);
  showToast('Возвращение отмечено в ' + t);
  updateTripUI();
}
function updateTripUI() {
  var data = tripData[tripKey()] || {};
  var startBtn = document.getElementById('btnStart');
  var endBtn = document.getElementById('btnEnd');
  var statusEl = document.getElementById('tripStatus');
  if (startBtn) startBtn.classList.toggle('active', !!data.start);
  if (endBtn) endBtn.classList.toggle('done-all', !!data.end);
  var txt = '';
  if (data.start) txt += '&#9654; выехал ' + data.start;
  if (data.end) txt += ' &nbsp; &#9632; вернулся ' + data.end;
  if (statusEl) statusEl.innerHTML = txt;
}

// ─── WORKTIME (рабочее время / смена, с перерывами) ─────────────
var wtData = {};                                              // {date:{seg:[{s,e}],done}} с сервера
var wtQueue = JSON.parse(localStorage.getItem('wtQueue_' + DRV) || '{}');
var wtPanelMode = 'view';
function saveWtQueue() { localStorage.setItem('wtQueue_' + DRV, JSON.stringify(wtQueue)); }
function wtDate() { return isoD(0); }                          // всегда сегодня
function wtToday() { return wtData[wtDate()] || wtQueue[wtDate()] || {}; }
function wtClone(o) { return o ? JSON.parse(JSON.stringify(o)) : null; }
function hm(s) { var p = (s || '0:0').split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); }
function wtSegs(rec) { var s = rec && rec.seg; if (!s) return []; return Array.isArray(s) ? s.slice() : Object.keys(s).map(function (k) { return s[k]; }); }
function wtOpenIdx(rec) { var L = wtSegs(rec); for (var i = L.length - 1; i >= 0; i--) { if (L[i] && L[i].s && !L[i].e) return i; } return -1; }
function wtWorkedMin(rec, live) {
  var L = wtSegs(rec), total = 0, nowM = null;
  for (var i = 0; i < L.length; i++) {
    var g = L[i]; if (!g || !g.s) continue;
    if (g.e) { var d = hm(g.e) - hm(g.s); if (d < 0) d += 1440; total += d; }
    else if (live) { if (nowM == null) { var n = new Date(); nowM = n.getHours() * 60 + n.getMinutes(); } var d2 = nowM - hm(g.s); if (d2 < 0) d2 += 1440; total += d2; }
  }
  return total;
}
function wtFmt(m) { return Math.floor(m / 60) + ':' + String(Math.round(m) % 60).padStart(2, '0'); }
function wtHoursDec(rec) { return Math.round(wtWorkedMin(rec, false) / 6) / 10; }
function wtState(rec) { if (rec && rec.done) return 'done'; if (wtOpenIdx(rec) >= 0) return 'run'; if (wtSegs(rec).length) return 'pause'; return 'idle'; }

// ⛔Не пишем, пока не пришёл первый снимок дня из базы: запись идёт целым днём, и тап по
//   кнопке на непрогруженных данных СТИРАЕТ уже отработанное. 10.08 так у Лёши пропали
//   4,5 часа: руль взят в 10:38, а в табеле день начался с 15:11.
//   Офлайн — исключение: там базы не будет вообще, а работать человеку надо.
var wtLoaded = false;   // пришёл ли первый снимок табеля из базы
// ⛔Ожидание данных НЕ должно превращаться в блокировку работы: если база молчит (плохая связь,
//   протухшая сессия), через 8 секунд разрешаем писать — иначе человек не начнёт день вообще.
setTimeout(function () { wtLoaded = true; }, 8000);
function wtMutate(fn) {
  if (!wtLoaded && navigator.onLine) { showToast('Секунду — загружаю ваш день…'); return; }
  var date = wtDate();
  var prev = wtClone(wtData[date]);
  var rec = wtClone(wtData[date]) || {};
  fn(rec);
  wtData[date] = rec;
  wtQueue[date] = rec; saveWtQueue();
  renderWtBtn(); wtRepanel();
  db.ref('worktime/' + DRV + '/' + date).update(rec).then(function () {
    if (wtQueue[date] && JSON.stringify(wtQueue[date]) === JSON.stringify(rec)) { delete wtQueue[date]; saveWtQueue(); }
  }).catch(function () {
    if (!navigator.onLine) return; // офлайн — останется в очереди, долетит позже
    function _rollback(msg){ if (JSON.stringify(wtData[date]) !== JSON.stringify(rec)) return; delete wtQueue[date]; saveWtQueue(); if (prev) wtData[date] = prev; else delete wtData[date]; renderWtBtn(); wtRepanel(); showToast(msg); }
    var u = firebase.auth().currentUser;
    if (!u) { _rollback('Сессия истекла — Выход и войдите заново'); return; }
    // протухшая сессия: обновляем токен и пробуем записать ещё раз, прежде чем откатывать
    u.getIdToken(true).then(function(){ return db.ref('worktime/' + DRV + '/' + date).update(rec); }).then(function(){
      if (wtQueue[date] && JSON.stringify(wtQueue[date]) === JSON.stringify(rec)) { delete wtQueue[date]; saveWtQueue(); }
    }).catch(function(){ _rollback('Сессия истекла — Выход и войдите заново'); });
  });
}
// Начало дня: за рулём — экран «пробег + роль», грузчику — сразу открытая смена.
function dayStart() {
  if (valMode === 'loader') { wtStartSeg(); return; }
  odoOpen('start');   // там же выбирается роль, и оттуда же откроется смена
}
// ⛔Кнопка додавала новий відрізок ЩОРАЗУ, не дивлячись, чи вже є відкритий. Досить було
//   тапнути двічі — і в табелі росла каша. 12.08 у Роми так набралось 15 відрізків за день
//   (включно з «11:29–10:30», де кінець раніше початку), бо в нього не працювала кнопка
//   ролі й він тиснув усе підряд. Тепер повторний тап нічого не додає.
function wtStartSeg() {
  wtMutate(function (rec) {
    var L = wtSegs(rec);
    if (wtOpenIdx(rec) >= 0) { rec.seg = L; rec.done = null; return; }   // зміна вже йде
    L.push({ s: nowTime() }); rec.seg = L; rec.done = null;
  });
  if (navigator.vibrate) navigator.vibrate(60);
}
function wtPauseSeg() { wtMutate(function (rec) { var L = wtSegs(rec); var i = wtOpenIdx(rec); if (i >= 0) L[i].e = nowTime(); rec.seg = L; }); if (navigator.vibrate) navigator.vibrate(40); }
// Закрыть день физически: время в табеле. Никаких проверок — их делает wtFinishDay.
// Когда человек в последний раз РАБОТАЛ (а не просто держал приложение открытым):
// отметка «Выполнено», фото доставки, событие одометра. Возвращает "ЧЧ:ММ" или null.
// ⛔За 30 дней шесть смен по 13–19 часов: работа кончилась вечером, «Конец» нажали ночью.
// Скільки треба на дорогу від останньої точки до складу. Джерела за спаданням точності:
//   1) число, пораховане для КОНКРЕТНОЇ адреси (кладе нічний робот у саму заявку);
//   2) запас по місту з налаштувань — коли адресу ще не порахували;
//   3) запас регіону — коли й міста немає в таблиці.
// ⛔Середнє по місту — не норматив, а страховка: райони Ганновера різняться на 40 хвилин.
function wtReturnMin(day) {
  var reg = null;
  try { reg = isNordDrv() ? 'nord' : 'main'; } catch (e) { reg = 'main'; }
  var tbl = (cfg && cfg.return_min && cfg.return_min[reg]) || {};
  var best = null, city = null;
  try {
    rows.forEach(function (r) {
      if (!r || r.date !== day || r.drv !== DRV || !r.doneTs) return;
      if (best == null || Number(r.doneTs) > best) { best = Number(r.doneTs); city = r.city || null; if (r.returnMin != null) city = { exact: Number(r.returnMin) }; }
    });
  } catch (e) {}
  if (city && city.exact != null) return city.exact;          // порахували саме цю адресу
  if (city && tbl.city && tbl.city[city] != null) return tbl.city[city];
  return tbl.def != null ? tbl.def : (reg === 'nord' ? 60 : 120);
}
// Остання реальна робота за вказаний день у вигляді "ЧЧ:ММ" (або null).
function wtLastWorkOn(day) {
  var best = 0;
  function take(ts) {
    ts = Number(ts); if (!ts) return;
    var d = new Date(ts), s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (s === day && ts > best) best = ts;
  }
  try { rows.forEach(function (r) { if (r && r.date === day) { take(r.doneTs); [].concat(r.photoTs || []).forEach(take); } }); } catch (e) {}
  try {
    var rec = (odoData || {})[day];
    if (rec) { if (rec.start) take(rec.start.ts); if (rec.end) take(rec.end.ts); Object.keys(rec.ev || {}).forEach(take); }
  } catch (e) {}
  if (!best) return null;
  var b = new Date(best);
  return String(b.getHours()).padStart(2, '0') + ':' + String(b.getMinutes()).padStart(2, '0');
}
// Пізніше цього часу закрити день не можна: остання робота + дорога до складу.
function wtCloseLimit(day) {
  var lw = wtLastWorkOn(day); if (!lw) return null;
  var p = lw.split(':'), m = (+p[0]) * 60 + (+p[1]) + wtReturnMin(day);
  if (m >= 1440) m = 1439;
  return { last: lw, limit: String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0') };
}
function wtLastWork() {
  var day = wtDate(), best = 0;
  function take(ts) {
    ts = Number(ts); if (!ts) return;
    var d = new Date(ts), s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (s === day && ts > best) best = ts;
  }
  try {
    rows.forEach(function (r) {
      if (!r || r.date !== day) return;
      take(r.doneTs);
      [].concat(r.photoTs || []).forEach(take);
    });
  } catch (e) {}
  try {
    var rec = odoRec();
    if (rec) {
      if (rec.start) take(rec.start.ts);
      if (rec.end) take(rec.end.ts);
      Object.keys(rec.ev || {}).forEach(take);
    }
    odoKmQ.forEach(function (q) { if (q && q.date === day) take(q.ts); });
  } catch (e) {}
  if (!best) return null;
  var b = new Date(best);
  return String(b.getHours()).padStart(2, '0') + ':' + String(b.getMinutes()).padStart(2, '0');
}
// Пора ли предлагать закрыть день временем последней работы: только если она кончилась
// заметно раньше, чем человек нажал «Конец». Иначе вопрос лишний.
function wtCloseSuggest() {
  var lw = wtLastWork(); if (!lw) return null;
  var p = String(lw).split(':'), lm = (+p[0]) * 60 + (+p[1]);
  var n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
  var gap = nm - lm; if (gap < 0) gap += 1440;
  return gap >= 45 ? { at: lw, gapMin: gap } : null;
}
function wtCloseDay(at) {
  var _at = at || nowTime();
  wtMutate(function (rec) { var L = wtSegs(rec); var i = wtOpenIdx(rec); if (i >= 0) L[i].e = _at; rec.seg = L; rec.done = true; });
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  // ⛔Порядок після закриття дня: спершу «з ким працював», потім підсумок годин.
  //   Раніше підсумок блимав на пів секунди і його одразу накривало питання про напарника.
  closeWtPanel();

var offlineQueue = JSON.parse(localStorage.getItem('photoQueue_'+DRV) || '[]');

function saveQueue() {
  return _lsSet('photoQueue_'+DRV, _qJSON(offlineQueue));

function processQueue() {
  if (!offlineQueue.length) return;
  var item = offlineQueue[0];
  if (item._processing) return;
  item._processing = true;

  // Convert base64 back to blob
  var byteStr = atob(item.b64.split(',')[1]);
  var mime = item.b64.split(';')[0].split(':')[1];
  var ab = new ArrayBuffer(byteStr.length);
  var ia = new Uint8Array(ab);
  for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
  var blob = new Blob([ab], {type: mime});

  storage.ref(item.path).put(blob).then(function(snap) {
    return snap.ref.getDownloadURL();
  }).then(function(url) {
    var r = rows.find(function(x) { return x.id === item.rowId; });
    var photos = (r && r.photos) ? [].concat(r.photos) : [];
    var photoTs = (r && r.photoTs) ? [].concat(r.photoTs) : [];
    var photoBy = (r && r.photoBy) ? [].concat(r.photoBy) : [];
    while (photoTs.length < photos.length) photoTs.push(null);
    while (photoBy.length < photos.length) photoBy.push('');
    // Remove pending placeholder if exists
    var pendingIdx = photos.indexOf('pending:'+item.localId);
    if (pendingIdx !== -1) {
      photos[pendingIdx] = url;
      photoTs[pendingIdx] = item.ts;
      photoBy[pendingIdx] = item.by || '';
    } else if (photos.indexOf(url) === -1) {
      photos.push(url);
      photoTs.push(item.ts);
      photoBy.push(item.by || '');
    }
    return db.ref('rows/' + item.rowId).update({photos: photos, photoTs: photoTs, photoBy: photoBy});
  }).then(function() {
    offlineQueue.shift();
    saveQueue();
    showToast('Фото загружено ✓');
    setTimeout(processQueue, 1000);
  }).catch(function() {

    }, function() { if (fired) return; fired = true; clearTimeout(tmr); cb(null); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });

function flushDoneQueue() {

function flushGeoQueue() {

    // выбрасываем протухшее/битое и то, что уже не примут (удалённая или переназначенная строка) — иначе вечные повторы каждые 30с
    if (!g || !g.ts || (Date.now() - g.ts) > 7 * 24 * 3600 * 1000 || (g.tries || 0) > 20) { delete geoQueue[id]; saveGeoQueue(); return; }
    db.ref('rows/' + id).update({ doneLat: g.lat, doneLon: g.lon, doneAcc: g.acc, doneGeoTs: g.ts }).then(function() {
      delete geoQueue[id]; saveGeoQueue();
    }).catch(function(err) {

      else { g.tries = (g.tries || 0) + 1; }

function markDone(id, val) {
  if (odoNeedFix()) { odoBlockToast(); return; }   // без пробега отметок не принимаем
  doneQueue[id] = val; saveDoneQueue();
  if (val) { doneTsQueue[id] = Date.now(); } else { delete doneTsQueue[id]; }
  saveDoneTsQueue();
  var r = rows.find(function(x) { return x.id === id; }); if (r) r.done = val; // локально «липко» — галочка не отскакивает
  render();
  // пишем КТО и КОГДА отметил — иначе постфактум не видно, кто был на точке (нужно для разбора маршрута)
  var _u = {done: val, doneBy: DRV, doneByName: driverName()};
  if (val) _u.doneTs = doneTsQueue[id] || Date.now(); // при отмене время НЕ перезаписываем (как в диспетчере)
  // а координаты при отмене СТИРАЕМ — иначе останутся «доказательством присутствия» на невыполненной точке
  else { _u.doneLat = null; _u.doneLon = null; _u.doneAcc = null; _u.doneGeoTs = null; }
  db.ref('rows/' + id).update(_u).then(function() {
    if (doneQueue[id] === val) { delete doneQueue[id]; saveDoneQueue(); }
  }).catch(function() {});
  if (val && navigator.vibrate) navigator.vibrate([60,30,60]);
  showToast(val ? 'Выполнено &#10003;' : 'Отменено');
  // координаты берём ПОСЛЕ отметки, чтобы не задерживать водителя; долетят сами (в т.ч. из очереди)
  if (val) {
    var _t0 = Date.now();
    grabGeo(function(g) {
      if (!g) return;
      // телефон мог «уснуть» и ответ прийти много позже — тогда координата уже НЕ про эту точку, отбрасываем
      if (Date.now() - _t0 > 60000) return;
      g.ts = Date.now(); g.tries = 0;
      geoQueue[id] = g; saveGeoQueue();
      db.ref('rows/' + id).update({ doneLat: g.lat, doneLon: g.lon, doneAcc: g.acc, doneGeoTs: g.ts }).then(function() {
        delete geoQueue[id]; saveGeoQueue();
      }).catch(function() {});
    });

function isNordDrv(){ return DRV === 'C' || (cfg.drivers && cfg.drivers[DRV] && cfg.drivers[DRV].nord === true); }

    else db.ref('nord_driver/' + wtDate()).once('value', function(s){ var v = s.val(); if (v && v.drv === DRV) db.ref('nord_driver/' + wtDate()).remove(); });
  } catch (e) {}

//   Зранку — скільки роботи сьогодні. Увечері, коли день уже закрито і водій зайшов ще
//   раз, — скільки її завтра. Адрес немає ні там, ні там: вони відкриються після пробігу.
function routeVolume(day) {
  var d = day || curD;
  var mine = rows.filter(function (r) {
    return r && r.date === d && myRow(r) && r.inRoute !== false && ((r.addr && r.addr.trim()) || r.fromDriver);
  });
  var by = {}, order = [];
  mine.forEach(function (r) {
    var c = (r.city && String(r.city).trim()) || 'Без города';
    if (by[c] == null) { by[c] = 0; order.push(c); }
    by[c]++;
  });
  order.sort(function (a, b) { return by[b] - by[a]; });

function routeVolumeHtml(day) {

  return '<div class="rv-n">' + v.total + '</div><div class="rv-w">' + plural(v.total) + '</div><div class="rv-list">' + li + '</div>';
}
function plural(n) { var t = n % 100, o = n % 10; if (t > 10 && t < 20) return 'адресов'; if (o === 1) return 'адрес'; if (o > 1 && o < 5) return 'адреса'; return 'адресов'; }

  }).catch(function() {

  });
}
window.addEventListener('online', function() { setTimeout(processAddTaskQueue, 2500); });
setInterval(function() { if (addTaskQueue.length && navigator.onLine) processAddTaskQueue(); }, 30000);
setTimeout(processAddTaskQueue, 3500);

function submitAddTask(){
  if(_addPhotos.length === 0){ showToast('Добавьте хотя бы одно фото'); return; }
  var btn = document.getElementById('addFormSend');
  btn.disabled = true;
  btn.textContent = 'Сохраняю...';
  var rowId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  var comment = (document.getElementById('addFormComment').value || '').trim();
  var status = _addType === 'delivery' ? 'доставка материала' : 'вывоз мусора';
  var now = Date.now();
  var maxOrder = 0;
  rows.forEach(function(r){
    if(r.date === curD && myRow(r) && r.order != null && r.order > maxOrder) maxOrder = r.order;
  });
  var row = {
    id: rowId, date: curD, drv: routeDrv(),
    city: (document.getElementById('addFormCity')?document.getElementById('addFormCity').value:''),
    addr: (document.getElementById('addFormAddr')?document.getElementById('addFormAddr').value.trim():''),
    invs: [''], status: status, comment: comment, weight: null, volume_m3: null,
    inRoute: true, done: true, doneTs: now, doneBy: DRV, doneByName: driverName(), photos: [], photoTs: [],
    fromDriver: true, taskType: _addType, addedByDriver: driverName(),
    createdAt: now, order: maxOrder + 10
  };
  var metas = []; var left = _addPhotos.length;
  function finalize() {
    // оптимистично показываем задание сразу (⏳ на фото), даже без сети
    var opt = {}; for (var k in row) opt[k] = row[k];
    opt.photos = metas.map(function(m) { return 'pending:' + m.localId; });
    opt.photoTs = metas.map(function() { return now; });
    rows.push(opt); render();
    addTaskQueue.push({ row: row, photos: metas }); saveAddTaskQueue();
    setTimeout(processAddTaskQueue, 200);
    showToast('Задание добавлено ⏳ фото загрузятся');
    if(navigator.vibrate) navigator.vibrate([60,30,60]);
    closeAddForm();
    btn.textContent = 'Отправить ✓';
    btn.disabled = false;
  }
  _addPhotos.forEach(function(p, idx){
    var localId = _uid(); var path = 'photos/' + rowId + '/' + now + '_' + idx + '.jpg';
    compressPhoto(p.file, function(blob) {
      var reader = new FileReader();
      reader.onload = function(e) { metas.push({ path: path, b64: e.target.result, localId: localId }); left--; if (left <= 0) finalize(); };
      reader.onerror = function() { left--; if (left <= 0) finalize(); };
      reader.readAsDataURL(blob);
    });
  });
}

var APP_V = '2026-08-12-22';
var _verLast = 0, _verNew = null;
function verCheck() {
  var now = Date.now();
  if (now - _verLast < 300000) return;   // не чаще раза в 5 минут
  _verLast = now;
  fetch('ver.txt?cb=' + now, { cache: 'no-store' }).then(function (r) { return r.text(); })
    .then(function (t) { t = (t || '').trim(); if (t && t !== APP_V) { _verNew = t; verApply(); } })
    .catch(function () {});
}
function verApply() {
  if (!_verNew) return;
  var st = wtState(wtToday());
  var gateOpen = (document.getElementById('odoGate') || {}).classList && document.getElementById('odoGate').classList.contains('on');
  var pending = 0;
  try { pending = (offlineQueue || []).length + (odoKmQ || []).length + Object.keys(doneQueue || {}).length; } catch (e) { pending = 1; }
  if (st === 'idle' && !gateOpen && !pending) { location.reload(); return; }   // терять нечего — берём новую версию сразу
  verBar();   // работа идёт — решает человек
}
function verBar() {
  if (document.getElementById('verBar')) return;
  var b = document.createElement('div'); b.id = 'verBar';
  b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9800;background:#1a7a40;color:#fff;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px';
  b.innerHTML = '<span>Есть обновление приложения</span><button style="background:#fff;color:#0f2417;border:none;border-radius:8px;padding:8px 14px;font-weight:800;font-family:inherit" onclick="location.reload()">Обновить</button>';
  document.body.appendChild(b);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) verCheck(); });
setTimeout(verCheck, 20000);
setInterval(verCheck, 600000);
