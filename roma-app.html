<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Маршрут Рома">
<meta name="theme-color" content="#a03018">
<link rel="manifest" href="/delivery-app/manifest-roma.json">
<link rel="apple-touch-icon" href="/delivery-app/roma-192.png">
<title>Маршрут — Рома</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fdf2ee;color:#141a16;font-family:'Segoe UI',sans-serif;font-size:15px;padding-bottom:100px}
.hdr{background:#a03018;padding:16px 20px;position:sticky;top:0;z-index:10}
.hdr h1{color:#fff;font-size:18px;font-weight:700;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer}
.nav button:active{background:rgba(255,255,255,.35)}
.lbl{flex:1;text-align:center;color:#fff;font-size:14px;font-weight:600;background:rgba(255,255,255,.15);border-radius:10px;padding:8px}
.prg{display:flex;align-items:center;gap:8px;margin-top:10px}
.pb{flex:1;height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.pf{height:100%;background:#fff;border-radius:3px;transition:width .3s}
.pt{color:rgba(255,255,255,.9);font-size:12px;min-width:36px;text-align:right}
.sync{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);display:inline-block;margin-left:8px;vertical-align:middle}
.sync.ok{background:#fff}
/* TRIP BUTTONS */
.trip-bar{display:flex;gap:8px;margin-top:10px}
.trip-btn{flex:1;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.trip-btn:active{background:rgba(255,255,255,.35);transform:scale(.97)}
.trip-btn.active{background:rgba(255,255,255,.9);color:#a03018}
.trip-btn.done-all{background:rgba(255,255,255,.9);color:#a03018}
.trip-status{margin-top:8px;font-size:12px;color:rgba(255,255,255,.85);text-align:center;min-height:18px}
.wrap{padding:12px}
.city{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#a03018;margin:12px 0 6px 4px}
.card{background:#fff;border-radius:14px;border:2px solid #f0d0c4;margin-bottom:10px;overflow:hidden}
.card.dn{opacity:.7}
.cb{display:flex;align-items:flex-start;gap:10px;padding:13px 14px}
.num{width:26px;height:26px;border-radius:50%;background:#a03018;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.num.dn{background:rgba(0,0,0,.15)}
.info{flex:1;min-width:0}
.adr{font-size:15px;font-weight:600;color:#141a16;text-decoration:none;display:block;margin-bottom:3px}
.ttag{display:inline-flex;align-items:center;gap:3px;background:#fff3da;color:#7a4a00;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-bottom:4px}
.invs{font-size:12px;color:#5a7060;margin-top:3px}
.inv{display:inline-block;background:#eef3fb;color:#1856a0;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;margin:1px}
.stag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-top:4px}
.str{background:#fff3da;color:#7a4a00}
.ssv{background:#e6f5ec;color:#1a7a40}
.sur{background:#fff0f2;color:#b00020}
.cmt{font-size:12px;color:#5a7060;margin-top:3px;font-style:italic}
.dbtn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2px solid #f0d0c4;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc;margin-top:1px;transition:.15s}
.dbtn.dn{background:#a03018;border-color:#a03018;color:#fff}
.dbtn:active{transform:scale(.92)}
.dbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.mln{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:2px solid #f0d0c4;background:rgba(0,0,0,.02);color:#a03018;font-size:13px;font-weight:500;text-decoration:none}
.photo-section{padding:10px 14px;border-top:2px solid #f0d0c4;background:#fafaf8}
.photo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid #f0d0c4;transition:.15s}
.photo-thumb:active{transform:scale(.95)}
.photo-add{width:56px;height:56px;border-radius:8px;border:2px dashed #f0d0c4;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#aaa;flex-shrink:0}
.photo-hint{font-size:11px;color:#e07000;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.photo-count{font-size:11px;color:#5a7060;margin-top:4px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lb img{max-width:96vw;max-height:80vh;border-radius:8px;object-fit:contain}
.lb-close{color:#fff;font-size:28px;cursor:pointer;padding:8px 16px;background:rgba(255,255,255,.15);border-radius:20px;border:none}
.empty{text-align:center;padding:60px 20px;color:#5a7060}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2a1e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:998;opacity:0;transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* FAB Add Task */
.fab-add{position:fixed;right:18px;bottom:24px;width:60px;height:60px;border-radius:50%;background:#a03018;color:#fff;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:50;transition:.15s}
.fab-add:active{transform:scale(.92)}
/* Modal sheet for add task */
.add-sheet{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.add-sheet.on{display:flex}
.add-sheet-inner{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 0 28px;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.add-sheet-handle{width:38px;height:4px;background:#f0d0c4;border-radius:2px;margin:6px auto 8px}
.add-sheet-title{text-align:center;font-size:15px;font-weight:600;color:#141a16;padding:10px 16px 14px;border-bottom:1px solid #f0f0f0}
.add-type-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border:none;background:#fff;cursor:pointer;border-bottom:1px solid #f0f0f0;text-align:left}
.add-type-btn:active{background:#f5f5f5}
.add-type-btn:last-of-type{border-bottom:none}
.add-type-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.add-type-icon.delivery{background:#e6eef9;color:#1856a0}
.add-type-icon.trash{background:#fff3da;color:#854F0B}
.add-type-text{flex:1}
.add-type-text-main{font-size:15px;font-weight:600;color:#141a16;margin-bottom:2px}
.add-type-text-sub{font-size:12px;color:#80786e}
.add-cancel{display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:13px;border:none;background:#f5f5f5;color:#80786e;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}

/* Add task form (full screen) */
.add-form{position:fixed;inset:0;z-index:210;background:#fdf2ee;display:none;flex-direction:column;overflow-y:auto;padding-bottom:30px}
.add-form.on{display:flex}
.add-form-hdr{background:#a03018;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.add-form-back{border:none;background:rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer;flex-shrink:0}
.add-form-title{color:#fff;font-size:15px;font-weight:600;flex:1}
.add-form-body{padding:16px;flex:1}
.add-form-hint{font-size:13px;color:#5a7060;margin-bottom:14px;line-height:1.5}
.add-photo-zone{border:2px dashed #f0d0c4;border-radius:12px;padding:30px 20px;text-align:center;background:#fff;cursor:pointer;margin-bottom:14px}
.add-photo-zone:active{background:#f5f5f5}
.add-photo-zone-icon{font-size:40px;color:#a03018;margin-bottom:8px}
.add-photo-zone-text{font-size:14px;font-weight:600;color:#141a16}
.add-photo-zone-sub{font-size:11px;color:#80786e;margin-top:4px}
.add-photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:14px}
.add-photo-preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid #f0d0c4}
.add-photo-preview-item img{width:100%;height:100%;object-fit:cover}
.add-photo-preview-item .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.add-form-label{font-size:12px;color:#5a7060;font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.add-form-input{width:100%;border:1px solid #f0d0c4;border-radius:10px;padding:11px 12px;font-size:14px;background:#fff;color:#141a16;margin-bottom:14px;font-family:inherit}
.add-form-input:focus{outline:2px solid #a03018;outline-offset:-1px}
.add-form-send{width:100%;background:#a03018;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.add-form-send:active{transform:scale(.98)}
.add-form-send:disabled{background:#aac4b3;cursor:not-allowed}

/* Driver-added card visual marker */
.card.driver-added{border-color:#1856a0;border-width:2px;background:linear-gradient(to right,#e6eef9 0,#e6eef9 4px,#fff 4px)}
.card.driver-added .num{background:#1856a0}
.card.driver-added .by-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#1856a0;background:#e6eef9;padding:2px 7px;border-radius:6px;margin-top:4px}



.pin-wrap{position:fixed;inset:0;background:#a03018;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;transition:.15s}
.pdot.on{background:#fff;border-color:#fff}
.ppb{height:72px;border-radius:14px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:24px;font-weight:500;cursor:pointer}
.ppb:active{background:rgba(255,255,255,.3)}
/* WORKTIME (рабочее время) */
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-top h1{margin-bottom:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-btn{border:none;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:#fff;white-space:nowrap;flex-shrink:0;line-height:1;background:rgba(255,255,255,.16);transition:background .2s}
.wt-btn:active{transform:scale(.96)}
.wt-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
.wt-btn.idle{background:#e8902e}
.wt-btn.idle .wt-dot{animation:wtBlink 1.6s ease-in-out infinite}
.wt-btn.run{background:#15a34a}
.wt-btn.run .wt-dot{animation:wtBeat 1.4s ease-in-out infinite}
.wt-btn.done{background:rgba(255,255,255,.2)}
@keyframes wtBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes wtBeat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.6}}
.wt-btn.pause{background:#e8902e}
.wt-btn.pause .wt-dot{animation:wtBlink 1.6s ease-in-out infinite}
.wt-two{display:flex;gap:10px}
.wt-two .wt-main{width:auto;flex:1;font-size:15px;padding:14px 8px}
.wt-main.pause{background:#e8902e}
.wt-seglist{font-size:13px;color:#5a7060;margin:-6px 0 14px;line-height:1.7}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.exit-btn{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.exit-btn:active{background:rgba(255,255,255,.3)}
.wt-panel{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.wt-panel.on{display:flex}
.wt-panel-inner{background:#fff;width:100%;max-width:340px;border-radius:18px;padding:22px 20px;text-align:center;animation:wtPop .2s ease}
@keyframes wtPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.wt-panel-title{font-size:13px;font-weight:600;color:#80786e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.wt-status{font-size:17px;color:#141a16;line-height:1.5;margin-bottom:18px}
.wt-status b{font-size:22px;color:#1a7a40}
.wt-main{width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
.wt-main.start{background:#16a34a}
.wt-main.end{background:#d9342b}
.wt-main:active{transform:scale(.98)}
.wt-q{font-size:18px;font-weight:700;color:#141a16;margin-bottom:6px}
.wt-qs{font-size:16px;color:#5a7060;line-height:1.5;margin-bottom:18px}
.wt-qs b{font-size:22px;color:#1a7a40}
.wt-qbtns{display:flex;gap:10px}
.wt-cancel,.wt-yes{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.wt-cancel{background:#f0f0f0;color:#80786e}
.wt-yes{background:#1a7a40;color:#fff}
.wt-cancel:active,.wt-yes:active{transform:scale(.97)}
.wt-done-note{font-size:12px;color:#80786e;margin-top:6px}
.wt-close{margin-top:14px;background:none;border:none;color:#80786e;font-size:14px;cursor:pointer;padding:6px}
</style>
</head>
<body>
<div class="pin-wrap" id="pinWrap">
  <div style="color:#fff;font-size:20px;font-weight:700;margin-bottom:4px" id="driverPinName">Маршрут</div>
  <p style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:16px">Введите PIN-код</p>
  <div style="display:flex;gap:12px;margin-bottom:8px" id="pinDots">
    <div class="pdot" id="pd0"></div><div class="pdot" id="pd1"></div>
    <div class="pdot" id="pd2"></div><div class="pdot" id="pd3"></div>
  </div>
  <div style="color:#ffaaaa;font-size:13px;height:18px;margin-bottom:8px" id="pinErr"></div>
  <div style="display:grid;grid-template-columns:repeat(3,72px);gap:10px">
    <button class="ppb" onclick="dpp('1')">1</button><button class="ppb" onclick="dpp('2')">2</button><button class="ppb" onclick="dpp('3')">3</button>
    <button class="ppb" onclick="dpp('4')">4</button><button class="ppb" onclick="dpp('5')">5</button><button class="ppb" onclick="dpp('6')">6</button>
    <button class="ppb" onclick="dpp('7')">7</button><button class="ppb" onclick="dpp('8')">8</button><button class="ppb" onclick="dpp('9')">9</button>
    <button class="ppb" onclick="dpp('X')" style="font-size:16px">&#9003;</button><button class="ppb" onclick="dpp('0')">0</button>
    <button class="ppb" style="opacity:0" disabled></button>
  </div>
</div>
<div id="driverApp" style="display:none">
<div class="hdr">
  <div class="hdr-top">
    <h1 id="dn">Рома <span class="sync" id="sync"></span></h1>
    <div class="hdr-actions">
      <button class="wt-btn idle" id="wtBtn" onclick="wtBtnTap()"><span class="wt-dot"></span>Смена</button>
      <button class="wt-btn" id="wtEndBtn" style="display:none;background:#c0392b" onclick="odoOpen('end')">&#9209; Конец</button>
      <button class="exit-btn" onclick="wtLogout()">Выход</button>
    </div>
  </div>
  <div class="nav">
    <button id="prev">&#8249;</button>
    <div class="lbl" id="dl">загрузка...</div>
    <button id="next">&#8250;</button>
  </div>
  <div class="prg" id="prg" style="display:none">
    <div class="pb"><div class="pf" id="pf"></div></div>
    <div class="pt" id="pt"></div>
  </div>
  <div class="trip-bar">
    <button class="trip-btn" id="btnStart" onclick="tripStart()">&#9654; Маршрут начат</button>
    <button class="trip-btn" id="btnEnd" onclick="tripEnd()">&#9632; Вернулся на склад</button>
  </div>
  <div class="trip-status" id="tripStatus"></div>
</div>
<div class="wrap" id="wrap"></div>
<div class="lb" id="lb" style="display:none">
  <button class="lb-close" id="lbClose">&#215;</button>
  <img id="lbImg" src="" alt="">
</div>

<!-- iOS photo action sheet -->
<div id="photoSheet" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.5)" onclick="closePhotoSheet()">
  <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 32px" onclick="event.stopPropagation()">
    <div style="text-align:center;padding:12px;font-size:13px;color:#888;border-bottom:1px solid #eee">Добавить фото</div>
    <button onclick="triggerCamera()" style="display:block;width:100%;padding:16px;border:none;background:none;font-size:16px;color:#007AFF;border-bottom:1px solid #eee;cursor:pointer">📷 Камера</button>
    <button onclick="triggerGallery()" style="display:block;width:100%;padding:16px;border:none;background:none;font-size:16px;color:#007AFF;cursor:pointer">🖼 Выбрать из галереи</button>
    <button onclick="closePhotoSheet()" style="display:block;width:100%;padding:16px;border:none;background:none;font-size:16px;color:#FF3B30;margin-top:8px;cursor:pointer">Отмена</button>
  </div>
</div>
<input type="file" id="photoInputCamera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="photoInputGallery" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>
<!-- WORKTIME panel -->
<div class="wt-panel" id="wtPanel" onclick="if(event.target===this)closeWtPanel()">
  <div class="wt-panel-inner">
    <div class="wt-panel-title">Рабочее время · сегодня</div>
    <div id="wtPanelBody"></div>
    <button class="wt-close" id="wtCloseBtn" onclick="closeWtPanel()">Закрыть</button>
  </div>
</div>
<!-- FAB Add Task -->
<button class="fab-add" id="fabAddTask" onclick="openAddSheet()" title="Добавить задание">+</button>

<!-- Add task sheet (type selection) -->
<div class="add-sheet" id="addSheet" onclick="closeAddSheet(event)">
  <div class="add-sheet-inner" onclick="event.stopPropagation()">
    <div class="add-sheet-handle"></div>
    <div class="add-sheet-title">Что добавить?</div>
    <button class="add-type-btn" onclick="openAddForm('delivery')">
      <div class="add-type-icon delivery">📦</div>
      <div class="add-type-text">
        <div class="add-type-text-main">Доставка материала</div>
        <div class="add-type-text-sub">Фото накладной</div>
      </div>
    </button>
    <button class="add-type-btn" onclick="openAddForm('trash')">
      <div class="add-type-icon trash">🗑</div>
      <div class="add-type-text">
        <div class="add-type-text-main">Вывоз мусора</div>
        <div class="add-type-text-sub">Фото места загрузки</div>
      </div>
    </button>
    <button class="add-cancel" onclick="closeAddSheet()">Отмена</button>
  </div>
</div>

<!-- Add task form -->
<div class="add-form" id="addForm">
  <div class="add-form-hdr">
    <button class="add-form-back" onclick="closeAddForm()">&#8249;</button>
    <div class="add-form-title" id="addFormTitle">Новое задание</div>
  </div>
  <div class="add-form-body">
    <div class="add-form-hint" id="addFormHint"></div>
    <div class="add-form-label">Город</div>
    <select class="add-form-input ac-city" id="addFormCity"></select>
    <div class="add-form-label">Адрес</div>
    <input type="text" class="add-form-input ac-addr" id="addFormAddr" autocomplete="off" placeholder="Улица, дом… (или из списка)">
    <div class="add-photo-zone" id="addPhotoZone" onclick="addFormPickPhoto()">
      <div class="add-photo-zone-icon">📷</div>
      <div class="add-photo-zone-text">Сделать фото</div>
      <div class="add-photo-zone-sub">Можно несколько</div>
    </div>
    <div class="add-photo-preview" id="addPhotoPreview"></div>
    <div class="add-form-label">Комментарий (необязательно)</div>
    <input type="text" class="add-form-input" id="addFormComment" placeholder="Напр. адрес, № накладной, заметка">

var wtData = {};                                              // {date:{seg:[{s,e}],done}} с сервера

var wtPanelMode = 'view';

function wtDate() { return isoD(0); }                          // всегда сегодня
function wtToday() { return wtData[wtDate()] || wtQueue[wtDate()] || {}; }
function wtClone(o) { return o ? JSON.parse(JSON.stringify(o)) : null; }
function hm(s) { var p = (s || '0:0').split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); }
function wtSegs(rec) { var s = rec && rec.seg; if (!s) return []; return Array.isArray(s) ? s.slice() : Object.keys(s).map(function (k) { return s[k]; }); }
function wtOpenIdx(rec) { var L = wtSegs(rec); for (var i = L.length - 1; i >= 0; i--) { if (L[i] && L[i].s && !L[i].e) return i; } return -1; }
function wtWorkedMin(rec, live) {
  var L = wtSegs(rec), total = 0, nowM = null;
  for (var i = 0; i < L.length; i++) {
    var g = L[i]; if (!g || !g.s) continue;
    if (g.e) { var d = hm(g.e) - hm(g.s); if (d < 0) d += 1440; total += d; }
    else if (live) { if (nowM == null) { var n = new Date(); nowM = n.getHours() * 60 + n.getMinutes(); } var d2 = nowM - hm(g.s); if (d2 < 0) d2 += 1440; total += d2; }
  }
  return total;
}
function wtFmt(m) { return Math.floor(m / 60) + ':' + String(Math.round(m) % 60).padStart(2, '0'); }
function wtHoursDec(rec) { return Math.round(wtWorkedMin(rec, false) / 6) / 10; }
function wtState(rec) { if (rec && rec.done) return 'done'; if (wtOpenIdx(rec) >= 0) return 'run'; if (wtSegs(rec).length) return 'pause'; return 'idle'; }

function wtMutate(fn) {
  var date = wtDate();
  var prev = wtClone(wtData[date]);
  var rec = wtClone(wtData[date]) || {};
  fn(rec);
  wtData[date] = rec;
  wtQueue[date] = rec; saveWtQueue();
  renderWtBtn(); wtRepanel();
  db.ref('worktime/' + DRV + '/' + date).set(rec).then(function () {
    if (wtQueue[date] && JSON.stringify(wtQueue[date]) === JSON.stringify(rec)) { delete wtQueue[date]; saveWtQueue(); }
  }).catch(function () {
    if (navigator.onLine) {
      delete wtQueue[date]; saveWtQueue();
      if (prev) wtData[date] = prev; else delete wtData[date];
      renderWtBtn(); wtRepanel();
      showToast('Не сохранилось — войдите своим логином водителя');
    }
  });
}
function wtStartSeg() { wtMutate(function (rec) { var L = wtSegs(rec); L.push({ s: nowTime() }); rec.seg = L; rec.done = null; }); if (navigator.vibrate) navigator.vibrate(60); }
function wtPauseSeg() { wtMutate(function (rec) { var L = wtSegs(rec); var i = wtOpenIdx(rec); if (i >= 0) L[i].e = nowTime(); rec.seg = L; }); if (navigator.vibrate) navigator.vibrate(40); }
function wtFinishDay() { wtMutate(function (rec) { var L = wtSegs(rec); var i = wtOpenIdx(rec); if (i >= 0) L[i].e = nowTime(); rec.seg = L; rec.done = true; }); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }

// ── OFFLINE PHOTO QUEUE ──────────────────────────────────────
var offlineQueue = JSON.parse(localStorage.getItem('photoQueue_'+DRV) || '[]');

function saveQueue() {
  localStorage.setItem('photoQueue_'+DRV, JSON.stringify(offlineQueue));
}

function processQueue() {
  if (!offlineQueue.length) return;
  var item = offlineQueue[0];
  if (item._processing) return;
  item._processing = true;

  // Convert base64 back to blob
  var byteStr = atob(item.b64.split(',')[1]);
  var mime = item.b64.split(';')[0].split(':')[1];
  var ab = new ArrayBuffer(byteStr.length);
  var ia = new Uint8Array(ab);
  for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
  var blob = new Blob([ab], {type: mime});

  storage.ref(item.path).put(blob).then(function(snap) {
    return snap.ref.getDownloadURL();
  }).then(function(url) {
    var r = rows.find(function(x) { return x.id === item.rowId; });
    var photos = (r && r.photos) ? [].concat(r.photos) : [];
    var photoTs = (r && r.photoTs) ? [].concat(r.photoTs) : [];
    // Remove pending placeholder if exists
    var pendingIdx = photos.indexOf('pending:'+item.localId);
    if (pendingIdx !== -1) {
      photos[pendingIdx] = url;
      photoTs[pendingIdx] = item.ts;
    } else {
      photos.push(url);
      photoTs.push(item.ts);
    }
    return db.ref('rows/' + item.rowId).update({photos: photos, photoTs: photoTs});
  }).then(function() {
    offlineQueue.shift();
    saveQueue();
    showToast('Фото загружено ✓');
    setTimeout(processQueue, 1000);
  }).catch(function() {
    item._processing = false;
    setTimeout(processQueue, 15000);
  });
}

window.addEventListener('online', function() {
  setTimeout(processQueue, 2000);
});
setTimeout(processQueue, 3000);
// периодический повтор — на случай слабой сети (событие 'online' не срабатывает, если onLine и так true)
setInterval(function(){ if (offlineQueue.length && navigator.onLine) processQueue(); }, 30000);

function enqueuePhoto(file, rowId, path, localId, ts) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var b64 = e.target.result;
    var r = rows.find(function(x) { return x.id === rowId; });
    var photos = (r && r.photos) ? [].concat(r.photos) : [];
    var photoTs = (r && r.photoTs) ? [].concat(r.photoTs) : [];
    if (photos.indexOf('pending:' + localId) === -1) { photos.push('pending:' + localId); photoTs.push(ts); }
    if(r){ r.photos = photos; r.photoTs = photoTs; }
    render();
    try {
      offlineQueue.push({rowId: rowId, path: path, b64: b64, localId: localId, ts: ts});
      saveQueue();
      showToast('Слабая сеть — фото сохранено, загрузится само');
      setTimeout(processQueue, 1500);
    } catch(e) {
      showToast('Нет места для хранения фото');
    }
  };
  reader.readAsDataURL(file);
}

function uploadPhotoWithQueue(file, rowId) {
  var ext = (file.name || 'jpg').split('.').pop().toLowerCase() || 'jpg';
  var path = 'photos/' + rowId + '/' + Date.now() + '.' + ext;
  var localId = Date.now().toString(36);
  var ts = Date.now();

  if (navigator.onLine) {
    // Есть сеть: пробуем сразу; если не удалось (слабый сигнал/таймаут) — в очередь на автоповтор
    showToast('Загружаем фото...');
    storage.ref(path).put(file).then(function(snap) {
      return snap.ref.getDownloadURL();
    }).then(function(url) {
      var r = rows.find(function(x) { return x.id === rowId; });
      var photos = (r && r.photos) ? [].concat(r.photos) : [];
      var photoTs = (r && r.photoTs) ? [].concat(r.photoTs) : [];
      photos.push(url);
      photoTs.push(ts);
      if(r){ r.photos = photos; r.photoTs = photoTs; }
      return db.ref('rows/' + rowId).update({photos: photos, photoTs: photoTs});
    }).then(function() {
      showToast('Фото добавлено ✓');
      render();
    }).catch(function(err) {
      // Плохая сеть: НЕ теряем фото — кладём в очередь, она повторит сама
      enqueuePhoto(file, rowId, path, localId, ts);
    });
  } else {
    enqueuePhoto(file, rowId, path, localId, ts);
  }
}

function render() {

    return r.date === curD && r.drv === DRV && r.inRoute !== false && ((r.addr && r.addr.trim()) || r.fromDriver);
  });
  var tot = dr.length, dn = dr.filter(function(r) { return r.done; }).length;
  var prg = document.getElementById('prg');
  if (tot > 0) {
    prg.style.display = 'flex';
    document.getElementById('pf').style.width = Math.round(dn/tot*100) + '%';
    document.getElementById('pt').textContent = dn + '/' + tot;
  } else prg.style.display = 'none';

  var wrap = document.getElementById('wrap');
  if (!tot) {
    wrap.innerHTML = '<div class="empty"><div style="font-size:48px;margin-bottom:12px">&#128666;</div><p>Нет доставок на этот день</p></div>';
    return;
  }

  var hasOrder = dr.some(function(r) { return r.order != null; });
  var html = '', n = 1;
  function _routeCmp(a,b) {
    if (hasOrder) {
      var ao = a.order != null ? a.order : 99999;
      var bo = b.order != null ? b.order : 99999;
      if (ao !== bo) return ao - bo;
      return (a.createdAt||0) - (b.createdAt||0);
    }
    if (a.city < b.city) return -1;
    if (a.city > b.city) return 1;
    return (a.createdAt||0) - (b.createdAt||0);
  }
  var _pending = dr.filter(function(r) { return !r.done; }).sort(_routeCmp);
  var _doneRows = dr.filter(function(r) { return r.done; }).sort(_routeCmp);
  _pending.forEach(function(r) { html += renderRow(r, n++); });
  if (_doneRows.length) {
    html += '<div style="display:flex;align-items:center;gap:8px;margin:16px 4px 8px;color:#9a9a9a;font-size:12px;font-weight:600"><span style="flex:1;height:1px;background:#e0ddd4"></span>&#10003; Выполнено (' + _doneRows.length + ')<span style="flex:1;height:1px;background:#e0ddd4"></span></div>';
    _doneRows.forEach(function(r) { html += renderRow(r, n++); });
  }
    wrap.innerHTML = html;

  wrap.querySelectorAll('.dbtn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (this.disabled) return;
      var id = this.getAttribute('data-id');

      markDone(id, !isDone);
    });
  });
  wrap.querySelectorAll('.photo-add').forEach(function(btn) {

  });
  wrap.querySelectorAll('.photo-thumb').forEach(function(img) {
    img.addEventListener('click', function() { openLightbox(this.getAttribute('data-url')); });
  });
}

// Auth gate (Варіант A): доступ лише з валідною Firebase-сесією
function pageFor(c){c=c||{};var r=c.role;if(r==='zentrum'||r==='norden'||r==='lager')return 'index.html';if(r==='driver')return ({L:'lesha-app.html',R:'roma-app.html',C:'driver3-app.html',V:'valentyn-app.html'})[c.drv]||'login.html';if(r==='tech')return 'tech-app.html';if(r==='loader')return 'lager-app.html';return 'login.html';}
firebase.auth().onAuthStateChanged(function(user){
  if(!user){ location.replace('login.html'); return; }
  user.getIdTokenResult().then(function(res){
    var c=res.claims||{};
    if(!(c.role==='driver'&&c.drv===DRV)){ location.replace(pageFor(c)); return; }
    sessionStorage.removeItem('login_from');
    var __pw=document.getElementById('pinWrap'); if(__pw) __pw.style.display='none';

// ── Подсказка адреса в форме «+» (город + автодополнение, как у диспетчера) ──
// Источник адресов: план (rows, все водители) выбранного города + склады. Нет совпадения → ручной ввод.
function acCleanAddr(addr,city){
  var s=(''+(addr||'')).trim();
  if(city){ try{ var re=new RegExp('[,\\s]+'+city.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*$','i'); s=s.replace(re,'').trim(); }catch(e){} }
  s=s.replace(/\+/g,' ').replace(/\bE-?\s*Check\b/ig,' ').replace(/\bAsbest\b/ig,' ').replace(/\s{2,}/g,' ').trim();
  return s;
}
var PICKUPS=['Hornbach','ABEX'];
function _acx(s){return(''+(s||'')).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function acList(city){
  city=(''+(city||'')).trim(); var seen={},out=[];
  var cityset={}; ((cfg&&cfg.cities)||[]).forEach(function(c){ cityset[(''+c).trim().toLowerCase()]=1; });
  PICKUPS.forEach(function(s){ s=(''+s).trim(); if(!s)return; var k=s.toLowerCase(); if(seen[k])return; seen[k]=1; out.push({a:s,src:'store'}); });
  (rows||[]).forEach(function(r){ if(r&&(''+(r.city||'')).trim()===city&&r.addr&&(''+r.addr).trim()){ var c=acCleanAddr(r.addr,city); if(!c)return; var k=c.toLowerCase(); if(seen[k]||cityset[k])return; seen[k]=1; out.push({a:c,src:'plan'}); } });
  return out;
}
var _ac={inp:null,open:false,idx:-1,items:[]},_acGlob=false;
function acEl(){ var el=document.getElementById('acDrop'); if(!el){ el=document.createElement('div'); el.id='acDrop'; el.className='ac-drop'; document.body.appendChild(el); } return el; }
function acPos(){ var inp=_ac.inp,el=document.getElementById('acDrop'); if(!inp||!el)return; var r=inp.getBoundingClientRect(); el.style.left=r.left+'px'; el.style.top=(r.bottom+4)+'px'; el.style.width=Math.max(r.width,180)+'px'; }
function acCity(){ var cs=document.getElementById('addFormCity'); return cs?cs.value:''; }
function acRender(){
  var inp=_ac.inp; if(!inp)return;
  var all=acList(acCity()); var qq=(inp.value||'').trim().toLowerCase();
  var list=qq?all.filter(function(x){return x.a.toLowerCase().indexOf(qq)>-1;}):all;
  _ac.items=list; _ac.idx=-1;
  var el=acEl();
  if(!list.length){ el.innerHTML='<div class="ac-empty">Нет совпадений — вводится вручную</div>'; }
  else { el.innerHTML=list.map(function(x,k){ return '<div class="ac-opt" data-k="'+k+'"><span class="ac-ic">'+(x.src==='store'?'🏬':'🚚')+'</span><span class="ac-tx">'+_acx(x.a)+'</span></div>'; }).join(''); }
  Array.prototype.forEach.call(el.querySelectorAll('.ac-opt'),function(o){ o.addEventListener('mousedown',function(e){ e.preventDefault(); acPick(+o.getAttribute('data-k')); }); });
  acPos(); el.style.display='block'; _ac.open=true;
}
function acPick(k){ var x=_ac.items[k]; if(!x)return; if(_ac.inp)_ac.inp.value=x.a; acClose(); }
function acClose(){ var el=document.getElementById('acDrop'); if(el)el.style.display='none'; _ac.open=false; _ac.idx=-1; }
function acKey(e){
  if(!_ac.open)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); var n=_ac.items.length; if(!n)return;
    _ac.idx=e.key==='ArrowDown'?Math.min(n-1,_ac.idx+1):Math.max(0,_ac.idx-1);
    var el=document.getElementById('acDrop'); Array.prototype.forEach.call(el.querySelectorAll('.ac-opt'),function(o){ o.className='ac-opt'+((+o.getAttribute('data-k')===_ac.idx)?' hl':''); });
    var t=el.querySelector('.ac-opt.hl'); if(t)t.scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){ if(_ac.idx>-1){ e.preventDefault(); acPick(_ac.idx); } }
  else if(e.key==='Escape'){ acClose(); }
}
function acInside(t){ var el=document.getElementById('acDrop'); return !!(el&&(t===el||(el.contains&&el.contains(t)))); }
function acIsAddr(t){ return !!(t&&t.classList&&t.classList.contains('ac-addr')); }
function acInit(){
  if(_acGlob)return; _acGlob=true;
  var st=document.createElement('style'); st.textContent='.ac-drop{position:fixed;z-index:99999;background:#fff;border:1px solid #c7d6ee;border-radius:10px;box-shadow:0 12px 26px rgba(18,40,80,.22);overflow:auto;max-height:260px;display:none}.ac-opt{display:flex;align-items:center;gap:9px;padding:12px 12px;cursor:pointer;font-size:14px;font-weight:600;color:#123645;border-top:1px solid #eef2f9}.ac-opt:first-child{border-top:none}.ac-opt:active,.ac-opt.hl{background:#eaf1fd}.ac-ic{font-size:14px;line-height:1;flex:none}.ac-tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ac-empty{padding:12px;font-size:12.5px;color:#8a97ad;font-weight:500}';
  document.head.appendChild(st);
  document.addEventListener('focusin',function(e){ if(acIsAddr(e.target)){ e.target.setAttribute('autocomplete','off'); _ac.inp=e.target; acRender(); } });
  document.addEventListener('input',function(e){ if(e.target===_ac.inp&&acIsAddr(e.target)) acRender(); });
  document.addEventListener('click',function(e){ if(e.target===_ac.inp&&acIsAddr(e.target)&&!_ac.open) acRender(); });
  document.addEventListener('keydown',function(e){ if(e.target===_ac.inp&&acIsAddr(e.target)) acKey(e); });
  document.addEventListener('change',function(e){ if(e.target&&e.target.id==='addFormCity'&&_ac.open) acRender(); });
  window.addEventListener('scroll',function(e){ if(_ac.open&&!acInside(e.target))acClose(); },true);
  window.addEventListener('resize',function(){ if(_ac.open)acClose(); });
  document.addEventListener('mousedown',function(e){ if(_ac.open&&e.target!==_ac.inp&&!acInside(e.target))acClose(); });
}
acInit();
function submitAddTask(){
  if(_addPhotos.length === 0){ showToast('Добавьте хотя бы одно фото'); return; }
  var btn = document.getElementById('addFormSend');
  btn.disabled = true;
  btn.textContent = 'Отправка...';
  var rowId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  var comment = (document.getElementById('addFormComment').value || '').trim();
  var status = _addType === 'delivery' ? 'доставка материала' : 'вывоз мусора';

  var maxOrder = 0;
  rows.forEach(function(r){
    if(r.date === curD && r.drv === DRV && r.order != null && r.order > maxOrder) maxOrder = r.order;
  });

  var uploadPromises = _addPhotos.map(function(p, idx){
    var path = 'photos/' + rowId + '/' + p.ts + '_' + idx + '.jpg';
    return storage.ref(path).put(p.file).then(function(snap){
      return snap.ref.getDownloadURL();
    });
  });

  Promise.all(uploadPromises).then(function(urls){
    var now = Date.now();
    var row = {
      id: rowId,
      date: curD,
      drv: DRV,
      city: (document.getElementById('addFormCity')?document.getElementById('addFormCity').value:''),
      addr: (document.getElementById('addFormAddr')?document.getElementById('addFormAddr').value.trim():''),
      invs: [''],
      status: status,
      comment: comment,
      weight: null,
      volume_m3: null,
      inRoute: true,
      done: true,
      doneTs: now,
      photos: urls,
      photoTs: urls.map(function(){ return now; }),
      fromDriver: true,
      taskType: _addType,
      addedByDriver: driverName(),
      createdAt: now,
      order: maxOrder + 10
    };
    return db.ref('rows/' + rowId).set(row);
  }).then(function(){
    showToast('Задание добавлено ✓');
    if(navigator.vibrate) navigator.vibrate([60,30,60]);
    closeAddForm();
    btn.textContent = 'Отправить ✓';
    btn.disabled = false;
  }).catch(function(err){
    showToast('Ошибка: ' + (err.message || err));
    btn.textContent = 'Отправить ✓';
    btn.disabled = false;
  });
}
