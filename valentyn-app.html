<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Маршрут Валентин">
<meta name="theme-color" content="#1a7a40">
<link rel="manifest" href="/delivery-app/manifest-valentyn.json">
<link rel="apple-touch-icon" href="/delivery-app/lesha-192.png">
<title>Маршрут — Лёша</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f8f4;color:#141a16;font-family:'Segoe UI',sans-serif;font-size:15px;padding-bottom:100px}
.hdr{background:#6a1a7a;padding:16px 20px;position:sticky;top:0;z-index:10}
.hdr h1{color:#fff;font-size:18px;font-weight:700;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;width:36px;height:36px;font-size:20px;cursor:pointer}
.nav button:active{background:rgba(255,255,255,.35)}
.lbl{flex:1;text-align:center;color:#fff;font-size:14px;font-weight:600;background:rgba(255,255,255,.15);border-radius:10px;padding:8px}
.prg{display:flex;align-items:center;gap:8px;margin-top:10px}
.pb{flex:1;height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.pf{height:100%;background:#fff;border-radius:3px;transition:width .3s}
.pt{color:rgba(255,255,255,.9);font-size:12px;min-width:36px;text-align:right}
.sync{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);display:inline-block;margin-left:8px;vertical-align:middle}
.sync.ok{background:#fff}
/* TRIP BUTTONS */
.trip-bar{display:flex;gap:8px;margin-top:10px}
.trip-btn{flex:1;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.trip-btn:active{background:rgba(255,255,255,.35);transform:scale(.97)}
.trip-btn.active{background:rgba(255,255,255,.9);color:#6a1a7a}
.trip-btn.done-all{background:rgba(255,255,255,.9);color:#6a1a7a}
.trip-status{margin-top:8px;font-size:12px;color:rgba(255,255,255,.85);text-align:center;min-height:18px}
.wrap{padding:12px}
.city{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6a1a7a;margin:12px 0 6px 4px}
.card{background:#fff;border-radius:14px;border:2px solid #d8ede2;margin-bottom:10px;overflow:hidden}
.card.dn{opacity:.7}
.cb{display:flex;align-items:flex-start;gap:10px;padding:13px 14px}
.num{width:26px;height:26px;border-radius:50%;background:#6a1a7a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.num.dn{background:rgba(0,0,0,.15)}
.info{flex:1;min-width:0}
.adr{font-size:15px;font-weight:600;color:#141a16;text-decoration:none;display:block;margin-bottom:3px}
.ttag{display:inline-flex;align-items:center;gap:3px;background:#fff3da;color:#7a4a00;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-bottom:4px}
.invs{font-size:12px;color:#5a7060;margin-top:3px}
.inv{display:inline-block;background:#eef3fb;color:#1856a0;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;margin:1px}
.stag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-top:4px}
.str{background:#fff3da;color:#7a4a00}
.ssv{background:#e6f5ec;color:#6a1a7a}
.sur{background:#fff0f2;color:#b00020}
.cmt{font-size:12px;color:#5a7060;margin-top:3px;font-style:italic}
.dbtn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:2px solid #d8ede2;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc;margin-top:1px;transition:.15s}
.dbtn.dn{background:#6a1a7a;border-color:#6a1a7a;color:#fff}
.dbtn:active{transform:scale(.92)}
.dbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.mln{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:2px solid #d8ede2;background:rgba(0,0,0,.02);color:#6a1a7a;font-size:13px;font-weight:500;text-decoration:none}
.photo-section{padding:10px 14px;border-top:2px solid #d8ede2;background:#fafaf8}
.photo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid #d8ede2;transition:.15s}
.photo-thumb:active{transform:scale(.95)}
.photo-gal{width:56px;height:56px;border-radius:8px;border:2px dashed #c8d4e8;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:#8ba3c7;flex-shrink:0}
.photo-add{width:56px;height:56px;border-radius:8px;border:2px dashed #d8ede2;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#aaa;flex-shrink:0}
.photo-hint{font-size:11px;color:#e07000;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.photo-count{font-size:11px;color:#5a7060;margin-top:4px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lb img{max-width:96vw;max-height:80vh;border-radius:8px;object-fit:contain}
.lb-close{color:#fff;font-size:28px;cursor:pointer;padding:8px 16px;background:rgba(255,255,255,.15);border-radius:20px;border:none}
.empty{text-align:center;padding:60px 20px;color:#5a7060}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2a1e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:998;opacity:0;transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* FAB Add Task */
.fab-add{position:fixed;right:18px;bottom:24px;width:60px;height:60px;border-radius:50%;background:#6a1a7a;color:#fff;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:50;transition:.15s}
.fab-add:active{transform:scale(.92)}
/* Modal sheet for add task */
.add-sheet{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.add-sheet.on{display:flex}
.add-sheet-inner{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:8px 0 28px;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.add-sheet-handle{width:38px;height:4px;background:#d8b0e0;border-radius:2px;margin:6px auto 8px}
.add-sheet-title{text-align:center;font-size:15px;font-weight:600;color:#141a16;padding:10px 16px 14px;border-bottom:1px solid #f0f0f0}
.add-type-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border:none;background:#fff;cursor:pointer;border-bottom:1px solid #f0f0f0;text-align:left}
.add-type-btn:active{background:#f5f5f5}
.add-type-btn:last-of-type{border-bottom:none}
.add-type-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.add-type-icon.delivery{background:#e6eef9;color:#1856a0}
.add-type-icon.trash{background:#fff3da;color:#854F0B}
.add-type-text{flex:1}
.add-type-text-main{font-size:15px;font-weight:600;color:#141a16;margin-bottom:2px}
.add-type-text-sub{font-size:12px;color:#80786e}
.add-cancel{display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:13px;border:none;background:#f5f5f5;color:#80786e;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}

/* Add task form (full screen) */
.add-form{position:fixed;inset:0;z-index:210;background:#f0f8f4;display:none;flex-direction:column;overflow-y:auto;padding-bottom:30px}
.add-form.on{display:flex}
.add-form-hdr{background:#6a1a7a;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.add-form-back{border:none;background:rgba(255,255,255,.2);color:#fff;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer;flex-shrink:0}
.add-form-title{color:#fff;font-size:15px;font-weight:600;flex:1}
.add-form-body{padding:16px;flex:1}
.add-form-hint{font-size:13px;color:#5a7060;margin-bottom:14px;line-height:1.5}
.add-photo-zone{border:2px dashed #d8b0e0;border-radius:12px;padding:30px 20px;text-align:center;background:#fff;cursor:pointer;margin-bottom:14px}
.add-photo-zone:active{background:#f5f5f5}
.add-photo-zone-icon{font-size:40px;color:#6a1a7a;margin-bottom:8px}
.add-photo-zone-text{font-size:14px;font-weight:600;color:#141a16}
.add-photo-zone-sub{font-size:11px;color:#80786e;margin-top:4px}
.add-photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:14px}
.add-photo-preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid #d8b0e0}
.add-photo-preview-item img{width:100%;height:100%;object-fit:cover}
.add-photo-preview-item .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.add-form-label{font-size:12px;color:#5a7060;font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.add-form-input{width:100%;border:1px solid #d8b0e0;border-radius:10px;padding:11px 12px;font-size:14px;background:#fff;color:#141a16;margin-bottom:14px;font-family:inherit}
.add-form-input:focus{outline:2px solid #6a1a7a;outline-offset:-1px}
.add-form-send{width:100%;background:#6a1a7a;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.add-form-send:active{transform:scale(.98)}
.add-form-send:disabled{background:#aac4b3;cursor:not-allowed}

/* Driver-added card visual marker */
.card.driver-added{border-color:#1856a0;border-width:2px;background:linear-gradient(to right,#e6eef9 0,#e6eef9 4px,#fff 4px)}
.card.driver-added .num{background:#1856a0}
.card.driver-added .by-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#1856a0;background:#e6eef9;padding:2px 7px;border-radius:6px;margin-top:4px}



.pin-wrap{position:fixed;inset:0;background:#6a1a7a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;transition:.15s}
.pdot.on{background:#fff;border-color:#fff}
.ppb{height:72px;border-radius:14px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:24px;font-weight:500;cursor:pointer}
.ppb:active{background:rgba(255,255,255,.3)}
/* WORKTIME (рабочее время) */
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-top h1{margin-bottom:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-btn{border:none;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:#fff;white-space:nowrap;flex-shrink:0;line-height:1;background:rgba(255,255,255,.16);transition:background .2s}
.wt-btn:active{transform:scale(.96)}
.wt-dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
.wt-btn.idle{background:#e8902e}
.wt-btn.idle .wt-dot{animation:wtBlink 1.6s ease-in-out infinite}
.wt-btn.run{background:#15a34a}
.wt-btn.run .wt-dot{animation:wtBeat 1.4s ease-in-out infinite}
.wt-btn.done{background:rgba(255,255,255,.2)}
@keyframes wtBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes wtBeat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.6}}
.wt-btn.pause{background:#e8902e}
.wt-btn.pause .wt-dot{animation:wtBlink 1.6s ease-in-out infinite}
.wt-two{display:flex;gap:10px}
.wt-two .wt-main{width:auto;flex:1;font-size:15px;padding:14px 8px}
.wt-main.pause{background:#e8902e}
.wt-seglist{font-size:13px;color:#5a7060;margin:-6px 0 14px;line-height:1.7}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.exit-btn{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.exit-btn:active{background:rgba(255,255,255,.3)}
.wt-panel{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.wt-panel.on{display:flex}
.wt-panel-inner{background:#fff;width:100%;max-width:340px;border-radius:18px;padding:22px 20px;text-align:center;animation:wtPop .2s ease}
@keyframes wtPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.wt-panel-title{font-size:13px;font-weight:600;color:#80786e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px}
.wt-status{font-size:17px;color:#141a16;line-height:1.5;margin-bottom:18px}
.wt-status b{font-size:22px;color:#1a7a40}
.wt-main{width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
.wt-main.start{background:#16a34a}
.wt-main.end{background:#d9342b}
.wt-main:active{transform:scale(.98)}
.wt-q{font-size:18px;font-weight:700;color:#141a16;margin-bottom:6px}
.wt-qs{font-size:16px;color:#5a7060;line-height:1.5;margin-bottom:18px}
.wt-qs b{font-size:22px;color:#1a7a40}
.wt-qbtns{display:flex;gap:10px}
.wt-cancel,.wt-yes{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
.wt-cancel{background:#f0f0f0;color:#80786e}
.wt-yes{background:#1a7a40;color:#fff}
.wt-cancel:active,.wt-yes:active{transform:scale(.97)}
.wt-done-note{font-size:12px;color:#80786e;margin-top:6px}
.wt-close{margin-top:14px;background:none;border:none;color:#80786e;font-size:14px;cursor:pointer;padding:6px}
/* итог за месяц при закрытии смены */
.wt-summary{position:fixed;inset:0;z-index:400;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.wts-card{background:#fff;width:100%;max-width:280px;border-radius:20px;padding:24px 22px 20px;text-align:center;animation:wtPop .2s ease;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.wts-seal{width:54px;height:54px;border-radius:50%;background:#e6f4ec;color:#1a7a40;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.wts-h{font-size:17px;font-weight:800;color:#20242a;margin-bottom:16px}
.wts-day{font-size:12px;color:#8a8272;text-transform:uppercase;letter-spacing:.04em}
.wts-dayv{font-size:30px;font-weight:800;color:#6a1a7a;line-height:1;margin:3px 0 16px}
.wts-mrow{background:#faf5ec;border:1.5px solid #ecdcc2;border-radius:14px;padding:13px}
.wts-mlbl{font-size:11px;color:#854F0B;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.wts-mval{font-size:26px;font-weight:800;color:#854F0B;line-height:1.1}
.wts-msub{font-size:12px;color:#8a8272;margin-top:2px}
.wts-done{margin-top:16px;width:100%;background:#6a1a7a;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.wts-done:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="pin-wrap" id="pinWrap">
  <div style="color:#fff;font-size:20px;font-weight:700;margin-bottom:4px" id="driverPinName">Маршрут</div>
  <p style="color:rgba(255,255,255,.7);font-size:13px;margin-bottom:16px">Введите PIN-код</p>
  <div style="display:flex;gap:12px;margin-bottom:8px" id="pinDots">
    <div class="pdot" id="pd0"></div><div class="pdot" id="pd1"></div>
    <div class="pdot" id="pd2"></div><div class="pdot" id="pd3"></div>
  </div>
  <div style="color:#ffaaaa;font-size:13px;height:18px;margin-bottom:8px" id="pinErr"></div>
  <div style="display:grid;grid-template-columns:repeat(3,72px);gap:10px">
    <button class="ppb" onclick="dpp('1')">1</button><button class="ppb" onclick="dpp('2')">2</button><button class="ppb" onclick="dpp('3')">3</button>
    <button class="ppb" onclick="dpp('4')">4</button><button class="ppb" onclick="dpp('5')">5</button><button class="ppb" onclick="dpp('6')">6</button>
    <button class="ppb" onclick="dpp('7')">7</button><button class="ppb" onclick="dpp('8')">8</button><button class="ppb" onclick="dpp('9')">9</button>
    <button class="ppb" onclick="dpp('X')" style="font-size:16px">&#9003;</button><button class="ppb" onclick="dpp('0')">0</button>
    <button class="ppb" style="opacity:0" disabled></button>
  </div>
</div>
<div id="driverApp" style="display:none">
<div class="hdr">
  <div class="hdr-top">
    <h1 id="dn">Лёша <span class="sync" id="sync"></span></h1>
    <div class="hdr-actions">
      <button class="wt-btn idle" id="wtBtn" onclick="wtBtnTap()"><span class="wt-dot"></span>Смена</button>
      <button class="wt-btn" id="wtEndBtn" style="display:none;background:#c0392b" onclick="odoOpen('end')">&#9209; Конец</button>
      <button class="exit-btn" onclick="wtLogout()">Выход</button>
    </div>
  </div>
  <div class="nav">
    <button id="prev">&#8249;</button>
    <div class="lbl" id="dl">загрузка...</div>
    <button id="next">&#8250;</button>
  </div>
  <div class="prg" id="prg" style="display:none">
    <div class="pb"><div class="pf" id="pf"></div></div>
    <div class="pt" id="pt"></div>
  </div>
</div>
<div class="wrap" id="wrap"></div>
<div class="lb" id="lb" style="display:none">
  <button class="lb-close" id="lbClose">&#215;</button>
  <img id="lbImg" src="" alt="">
</div>

<!-- iOS photo action sheet -->
<div id="photoSheet" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.5)" onclick="closePhotoSheet()">
  <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 32px" onclick="event.stopPropagation()">
    <div style="text-align:center;padding:12px;font-size:13px;color:#888;border-bottom:1px solid #eee">Добавить фото</div>
    <button onclick="triggerCamera()" style="display:block;width:100%;padding:16px;border:none;background:none;font-size:16px;color:#007AFF;border-bottom:1px solid #eee;cursor:pointer">📷 Камера</button>
    <button onclick="triggerGallery()" style="display:block;width:100%;padding:16px;border:none;background:none;font-size:16px;color:#007AFF;cursor:pointer">🖼 Выбрать из галереи</button>
    <button onclick="closePhotoSheet()" style="display:block;width:100%;padding:16px;border:none;background:none;font-size:16px;color:#FF3B30;margin-top:8px;cursor:pointer">Отмена</button>
  </div>
</div>
<input type="file" id="photoInputCamera" accept="image/*" capture="environment" style="display:none">
<input type="file" id="photoInputGallery" accept="image/*" style="display:none">

<div class="toast" id="toast"></div>
<!-- WORKTIME panel -->
<div class="wt-panel" id="wtPanel" onclick="if(event.target===this)closeWtPanel()">
  <div class="wt-panel-inner">
    <div class="wt-panel-title">Рабочее время · сегодня</div>
    <div id="wtPanelBody"></div>
    <button class="wt-close" id="wtCloseBtn" onclick="closeWtPanel()">Закрыть</button>
  </div>
</div>
<!-- FAB Add Task -->
<button class="fab-add" id="fabAddTask" onclick="openAddSheet()" title="Добавить задание">+</button>

<!-- Add task sheet (type selection) -->
<div class="add-sheet" id="addSheet" onclick="closeAddSheet(event)">
  <div class="add-sheet-inner" onclick="event.stopPropagation()">
    <div class="add-sheet-handle"></div>
    <div class="add-sheet-title">Что добавить?</div>
    <button class="add-type-btn" onclick="openAddForm('delivery')">
      <div class="add-type-icon delivery">📦</div>
      <div class="add-type-text">
        <div class="add-type-text-main">Доставка материала</div>
        <div class="add-type-text-sub">Фото накладной</div>
      </div>
    </button>

function wtSegs(rec) { var s = rec && rec.seg; if (!s) return []; return Array.isArray(s) ? s.slice() : Object.keys(s).map(function (k) { return s[k]; }); }
function wtOpenIdx(rec) { var L = wtSegs(rec); for (var i = L.length - 1; i >= 0; i--) { if (L[i] && L[i].s && !L[i].e) return i; } return -1; }
function wtWorkedMin(rec, live) {
  var L = wtSegs(rec), total = 0, nowM = null;
  for (var i = 0; i < L.length; i++) {
    var g = L[i]; if (!g || !g.s) continue;
    if (g.e) { var d = hm(g.e) - hm(g.s); if (d < 0) d += 1440; total += d; }
    else if (live) { if (nowM == null) { var n = new Date(); nowM = n.getHours() * 60 + n.getMinutes(); } var d2 = nowM - hm(g.s); if (d2 < 0) d2 += 1440; total += d2; }

  var date = wtDate();

  fn(rec);
  wtData[date] = rec;

  }).catch(function () {
    if (!navigator.onLine) return; // офлайн — останется в очереди, долетит позже

    var u = firebase.auth().currentUser;
    if (!u) { _rollback('Сессия истекла — Выход и войдите заново'); return; }
    u.getIdToken(true).then(function(){ return db.ref('worktime/' + DRV + '/' + date).set(rec); }).then(function(){
      if (wtQueue[date] && JSON.stringify(wtQueue[date]) === JSON.stringify(rec)) { delete wtQueue[date]; saveWtQueue(); }

// ── OFFLINE PHOTO QUEUE ──────────────────────────────────────
var offlineQueue = JSON.parse(localStorage.getItem('photoQueue_'+DRV) || '[]');

function saveQueue() {
  return _lsSet('photoQueue_'+DRV, _qJSON(offlineQueue));
}

function processQueue() {
  if (!offlineQueue.length) return;
  var item = offlineQueue[0];
  if (item._processing) return;
  item._processing = true;

  // Convert base64 back to blob
  var byteStr = atob(item.b64.split(',')[1]);
  var mime = item.b64.split(';')[0].split(':')[1];
  var ab = new ArrayBuffer(byteStr.length);
  var ia = new Uint8Array(ab);
  for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
  var blob = new Blob([ab], {type: mime});

  storage.ref(item.path).put(blob).then(function(snap) {
    return snap.ref.getDownloadURL();
  }).then(function(url) {
    var r = rows.find(function(x) { return x.id === item.rowId; });
    var photos = (r && r.photos) ? [].concat(r.photos) : [];
    var photoTs = (r && r.photoTs) ? [].concat(r.photoTs) : [];
    var photoBy = (r && r.photoBy) ? [].concat(r.photoBy) : [];
    while (photoTs.length < photos.length) photoTs.push(null);
    while (photoBy.length < photos.length) photoBy.push('');
    // Remove pending placeholder if exists
    var pendingIdx = photos.indexOf('pending:'+item.localId);
    if (pendingIdx !== -1) {
      photos[pendingIdx] = url;
      photoTs[pendingIdx] = item.ts;
      photoBy[pendingIdx] = item.by || '';
    } else if (photos.indexOf(url) === -1) {
      photos.push(url);
      photoTs.push(item.ts);
      photoBy.push(item.by || '');
    }
    return db.ref('rows/' + item.rowId).update({photos: photos, photoTs: photoTs, photoBy: photoBy});
  }).then(function() {
    offlineQueue.shift();
    saveQueue();
    showToast('Фото загружено ✓');
    setTimeout(processQueue, 1000);
  }).catch(function() {
    item._processing = false;
    // Молчащая ошибка = водитель думает, что кнопка не работает. Говорим честно, но без спама.
    item._tries = (item._tries || 0) + 1;
    if (item._tries === 1 || item._tries % 5 === 0) showToast('Фото не уходит (' + offlineQueue.length + ' в очереди) — проверьте интернет. Оно сохранено');
    if (item._tries === 3 && typeof _refreshAuth === 'function') _refreshAuth();  // возможно, протухла сессия
    setTimeout(processQueue, 15000);
  });
}

// ── Сжатие фото: длинная сторона ≤1600px, JPEG ~0.7 → ~200-500 КБ вместо 3-8 МБ ──
// Быстрая заливка даже на слабом 3G и не переполняет localStorage-очередь.
// Гарантирует РОВНО ОДИН вызов cb (guard + таймаут-предохранитель), иначе поток мог бы зависнуть.
function compressPhoto(file, cb, lvl) {
  lvl = lvl || { side: 1600, q: 0.7 }; // без аргумента — прежнее поведение
  var done = false;
  function fin(x) { if (done) return; done = true; cb(x); }
  if (!file || !file.type || file.type.indexOf('image') !== 0) { fin(file); return; }
  var tmr = setTimeout(function() { fin(file); }, 8000);
  function finc(x) { clearTimeout(tmr); fin(x); }
  try {
    var img = new Image();
    var ou = URL.createObjectURL(file);
    img.onload = function() {
      try { URL.revokeObjectURL(ou); } catch(e) {}
      try {
        var W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
        if (!W || !H) { finc(file); return; }
        var sc = Math.min(1, lvl.side / Math.max(W, H));
        var w = Math.max(1, Math.round(W * sc)), h = Math.max(1, Math.round(H * sc));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        if (cv.toBlob) {
          cv.toBlob(function(b) { finc(b && b.size ? b : file); }, 'image/jpeg', lvl.q);
        } else {
          var d = cv.toDataURL('image/jpeg', lvl.q); var s = atob(d.split(',')[1]);
          var ab = new ArrayBuffer(s.length); var ia = new Uint8Array(ab);
          for (var i = 0; i < s.length; i++) ia[i] = s.charCodeAt(i);
          finc(new Blob([ab], { type: 'image/jpeg' }));
        }
      } catch(e) { finc(file); }
    };
    img.onerror = function() { try { URL.revokeObjectURL(ou); } catch(e) {} finc(file); };
    img.src = ou;
  } catch(e) { finc(file); }
}
function _uid() { return Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
// Сериализация очередей БЕЗ временных флагов (_processing/_p): иначе элемент с _processing:true,
// сохранённый в localStorage (второе фото пока первое грузится), после reload заклинит очередь навсегда.
function _qJSON(arr) { return JSON.stringify(arr, function(k, v) { return k.charAt(0) === '_' ? undefined : v; }); }
// Запись в localStorage с ЧЕСТНЫМ результатом. Раньше тут молчал catch{}: при переполнении квоты
// фото не попадало на диск, жило только в памяти вкладки — браузер выгружал вкладку, и фото
// исчезало без следа (жалоба водителя 29.07.2026). Теперь вызывающий код знает о провале.
function _lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } }
// Сколько символов заняли ОЧЕРЕДИ ФОТО. Все три (доставка/одометр/доп.задание) делят одну квоту
// браузера (~5 МБ), поэтому считаем вместе — иначе застрявший одометр съест место доставке.
function _qChars() {
  var n = 0;
  try {
    ['photoQueue_', 'odoQ_', 'addTaskQueue_'].forEach(function(p) {
      var s = localStorage.getItem(p + DRV); if (s) n += s.length;
    });
  } catch(e) {}
  return n;
}
// Чем полнее очереди, тем мельче жмём следующее фото доставки: при долгом отсутствии сети водитель
// успевает наснимать столько, что квота кончается. Пустая очередь = прежнее качество 1600px/0.7.
function photoLvl(chars) {
  if (chars > 1400000) return { side: 1024, q: 0.5 };
  if (chars > 700000) return { side: 1280, q: 0.6 };
  return { side: 1600, q: 0.7 };
}

function uploadPhotoWithQueue(file, rowId) {
  var localId = _uid();
  var ts = Date.now();
  var path = 'photos/' + rowId + '/' + ts + '_' + localId + '.jpg';
  // 1) СРАЗУ показываем фото (⏳) и разблокируем «Выполнено» — водитель не ждёт сеть
  var r = rows.find(function(x) { return x.id === rowId; });
  var photos = (r && r.photos) ? [].concat(r.photos) : [];
  var photoTs = (r && r.photoTs) ? [].concat(r.photoTs) : [];
  photos.push('pending:' + localId); photoTs.push(ts);
  if (r) { r.photos = photos; r.photoTs = photoTs; }
  render();
  showToast('Фото добавлено ⏳ загрузка идёт');
  // 2) сжать и положить в очередь; заливка + автоповтор идут в фоне, водителя не блокируют
  compressPhoto(file, function(blob) {
    var reader = new FileReader();
    reader.onload = function(e) {
      offlineQueue.push({ rowId: rowId, path: path, b64: e.target.result, localId: localId, ts: ts, by: driverName() });
      // saveQueue() честно говорит, попало ли фото на диск. Если нет — оно живёт только в этой
      // вкладке, браузер её выгрузит и фото пропадёт. Поэтому предупреждаем ЯВНО, а не молчим.
      if (!saveQueue()) showToast('Мало памяти — НЕ закрывайте приложение, фото ещё не сохранено');
      setTimeout(processQueue, 200);
    };
    reader.onerror = function() {
      // не удалось прочитать в base64 — заливаем blob напрямую как запасной путь, чтобы не потерять фото
      storage.ref(path).put(blob).then(function(snap) { return snap.ref.getDownloadURL(); }).then(function(url) {
        var r2 = rows.find(function(x) { return x.id === rowId; });
        var ph = (r2 && r2.photos) ? [].concat(r2.photos) : []; var pt = (r2 && r2.photoTs) ? [].concat(r2.photoTs) : [];
        var pb = (r2 && r2.photoBy) ? [].concat(r2.photoBy) : []; while (pb.length < ph.length) pb.push('');
        var ix = ph.indexOf('pending:' + localId); if (ix !== -1) { ph[ix] = url; pt[ix] = ts; pb[ix] = driverName(); } else if (ph.indexOf(url) === -1) { ph.push(url); pt.push(ts); pb.push(driverName()); }
        if (r2) { r2.photos = ph; r2.photoTs = pt; r2.photoBy = pb; }
        db.ref('rows/' + rowId).update({ photos: ph, photoTs: pt, photoBy: pb });
      }).catch(function() { showToast('Фото не сохранилось, повторите'); });
    };
    reader.readAsDataURL(blob);
  }, photoLvl(_qChars()));
}

  });
  var tot = dr.length, dn = dr.filter(function(r) { return r.done; }).length;

    prg.style.display = 'flex';

    return;
  }

  var hasOrder = dr.some(function(r) { return r.order != null; });
  var html = '', n = 1;
  function _routeCmp(a,b) {
    if (hasOrder) {
      var ao = a.order != null ? a.order : 99999;
      var bo = b.order != null ? b.order : 99999;
      if (ao !== bo) return ao - bo;
      return (a.createdAt||0) - (b.createdAt||0);
    }
    if (a.city < b.city) return -1;
    if (a.city > b.city) return 1;
    return (a.createdAt||0) - (b.createdAt||0);
  }
  var _pending = dr.filter(function(r) { return !r.done; }).sort(_routeCmp);
  var _doneRows = dr.filter(function(r) { return r.done; }).sort(_routeCmp);
  _pending.forEach(function(r) { html += renderRow(r, n++); });
  if (_doneRows.length) {

  });
  wrap.querySelectorAll('.photo-gal').forEach(function(btn) {

  });
}

  var item = addTaskQueue[0];
  if (item._processing) return;
  item._processing = true;
  var ups = (item.photos || []).map(function(ph) {
    var byteStr = atob(ph.b64.split(',')[1]); var mime = ph.b64.split(';')[0].split(':')[1];
    var ab = new ArrayBuffer(byteStr.length); var ia = new Uint8Array(ab);
    for (var i = 0; i < byteStr.length; i++) ia[i] = byteStr.charCodeAt(i);
    return storage.ref(ph.path).put(new Blob([ab], { type: mime })).then(function(snap) { return snap.ref.getDownloadURL(); });
  });
  Promise.all(ups).then(function(urls) {
    var row = item.row; row.photos = urls; row.photoTs = urls.map(function() { return row.doneTs || Date.now(); }); row.photoBy = urls.map(function() { return row.doneByName || ''; });
    return db.ref('rows/' + row.id).set(row);
  }).then(function() {
    addTaskQueue.shift(); saveAddTaskQueue();
    setTimeout(processAddTaskQueue, 500);
  }).catch(function() {
    item._processing = false; setTimeout(processAddTaskQueue, 15000);
  });
}
window.addEventListener('online', function() { setTimeout(processAddTaskQueue, 2500); });
setInterval(function() { if (addTaskQueue.length && navigator.onLine) processAddTaskQueue(); }, 30000);
setTimeout(processAddTaskQueue, 3500);

function submitAddTask(){
  if(_addPhotos.length === 0){ showToast('Добавьте хотя бы одно фото'); return; }
  var btn = document.getElementById('addFormSend');
  btn.disabled = true;
  btn.textContent = 'Сохраняю...';
  var rowId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  var comment = (document.getElementById('addFormComment').value || '').trim();
  var status = _addType === 'delivery' ? 'доставка материала' : 'вывоз мусора';
  var now = Date.now();
  var maxOrder = 0;
  rows.forEach(function(r){
    if(r.date === curD && r.drv === DRV && r.order != null && r.order > maxOrder) maxOrder = r.order;
  });
  var row = {
    id: rowId, date: curD, drv: DRV,
    city: (document.getElementById('addFormCity')?document.getElementById('addFormCity').value:''),
    addr: (document.getElementById('addFormAddr')?document.getElementById('addFormAddr').value.trim():''),
    invs: [''], status: status, comment: comment, weight: null, volume_m3: null,
    inRoute: true, done: true, doneTs: now, doneBy: DRV, doneByName: driverName(), photos: [], photoTs: [],
    fromDriver: true, taskType: _addType, addedByDriver: driverName(),
    createdAt: now, order: maxOrder + 10
  };
  var metas = []; var left = _addPhotos.length;
  function finalize() {
    // оптимистично показываем задание сразу (⏳ на фото), даже без сети
    var opt = {}; for (var k in row) opt[k] = row[k];
    opt.photos = metas.map(function(m) { return 'pending:' + m.localId; });
    opt.photoTs = metas.map(function() { return now; });
    rows.push(opt); render();
    addTaskQueue.push({ row: row, photos: metas }); saveAddTaskQueue();
    setTimeout(processAddTaskQueue, 200);
    showToast('Задание добавлено ⏳ фото загрузятся');
    if(navigator.vibrate) navigator.vibrate([60,30,60]);
    closeAddForm();
    btn.textContent = 'Отправить ✓';
    btn.disabled = false;
  }
  _addPhotos.forEach(function(p, idx){
    var localId = _uid(); var path = 'photos/' + rowId + '/' + now + '_' + idx + '.jpg';
    compressPhoto(p.file, function(blob) {
      var reader = new FileReader();
      reader.onload = function(e) { metas.push({ path: path, b64: e.target.result, localId: localId }); left--; if (left <= 0) finalize(); };
      reader.onerror = function() { left--; if (left <= 0) finalize(); };
      reader.readAsDataURL(blob);
    });
  });
}
